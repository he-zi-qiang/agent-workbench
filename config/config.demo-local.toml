# The profile a single-machine console runs: everything this deployment can do,
# in one process group.
#
# config.web-local.toml and config.word-local.toml each demonstrate *one*
# capability, and stay separate from each other on purpose -- MCP tool names are
# frozen into every newly submitted Task envelope, so a profile carrying both
# widens every Task by both. That separation is right for the two walkthroughs
# and wrong for the console, which is one application: a person who types
# "写一份 Word 报告" into Work is not choosing a profile, and on the web profile
# that Task has no renderer in its envelope. What it did instead is the reason
# this file exists -- it wrote Markdown into a file called `report.docx`, and
# the console showed a Word document that was not one (task_9bb8446a…,
# 2026-08-12). `workspace_write` now refuses that name; this profile is what
# gives the model the tool it should have reached for instead.
#
# So this is the union, declared once and openly, rather than the union arrived
# at by editing one of the narrow profiles. Both of those still load, still
# carry one server each, and the tests that pin them apart still pass.
#
# Like the others, one overlay over config.default.toml. The DSNs and the
# provider key remain environment-only and are exported by scripts/dev.sh; no
# credential belongs here.
#
# Two servers must already be running before this profile does anything:
#
#   scripts/dev.sh word-server    # 127.0.0.1:8765
#   scripts/dev.sh web-server     # 127.0.0.1:8767
#
# `scripts/dev.sh demo-worker` probes both before starting, because a Worker
# that comes up without them registers no MCP tool and says so only in a log
# line nobody is watching.

[app]
environment = "development"
deployment_scope = "local"
log_level = "INFO"

[model.main]
# Pinned to the concrete v4 id rather than the `deepseek-chat` alias the other
# profiles keep: this profile declares a thinking stance, and a stance should
# name the model it was probed against -- the alias's target moves server-side
# (it already resolves to v4-flash today, verified 2026-08-16, ADR-061).
model_id = "deepseek-v4-flash"
# The ordinary baseline may force one opening tool call, which is unsafe here
# for the reason both narrow profiles give: a Task without the matching scope
# would be forced to propose a tool it cannot use. The writer reaches for Word
# when the objective asks for a document, and unrelated Work stays usable.
tool_calling_required = false
# 实测而非猜测：2026-08-26 直接对 provider 打了一次 `max_tokens=16384` 的请求，
# 回来 `completion_tokens: 11000`、`finish_reason: "stop"`——自然收尾，不是被截断。
# 也就是说 `config.default.toml` 的 8192 是**真的卡着**的，而且这个部署从来没有
# 选过它，它只是默认值。同一批探测里 `max_tokens` 一路给到 200000 provider 都回
# 200，所以"它接受"证明不了上限——只有生成出来的长度算数，16384 是量出来的那个数。
#
# 别往上填没量过的数字：适配器会擦掉 provider 的错误正文（那里出现过 prompt 回显），
# 一个供应商不收的值最后只会变成转录里一句 HTTP 400，指向唯一没出问题的组件。
max_output_tokens = 16384
#
# 同一份文档把这个模型的 Max Output 记作 384K。**没有取它**，而且这是个选择不是
# 遗漏：`max_output_tokens` 除了给长回答留空间，也是跑飞的那一轮唯一的刹车，而
# 一次编码回合要写的文件很少超过 16384 token（约 60KB 文本）。要更大就往上调，
# 只是别忘了它同时是账单的上限。

# 这个部署的模型物理上能装多少（ADR-080）。**查来的 + 量过的，不是猜的。**
#
# 在这之前九个 profile 一个都没有声明它，于是 `domain/runs.py` 的
# `context_reason_for` 直接返回 `None`——ADR-080 的上下文天花板与 ADR-081 的压缩
# **两个都不生效**。后果不是"长会话质量下降"，是这一轮直接死在 provider 的 400 上，
# 而适配器会擦掉 provider 的错误正文，转录里只剩一句 HTTP 400。
#
# 1000000 来自 DeepSeek 自己的 Models & Pricing 页（2026-08-26 读取）：
# `deepseek-v4-flash` 的 Context Length 记作 1M tokens、Max Output 记作 384K。
#
# 为什么不直接照抄文档就完事：这个仓库自己记过一个对不上的数。docs/status.md 第
# 二十一批（ADR-081 复查）写着实测"三次在 70,000 token 打 64,000 的窗口"，终局
# HTTP 400。所以 2026-08-26 直接对 provider 打了两次大输入验证，用的就是这里这个
# model_id：
#
#     900,000 字符 → prompt_tokens = 200089 → HTTP 200
#     400,000 字符 → prompt_tokens =  88977 → HTTP 200
#
# 也就是说那个 64,000 是旧模型时代的数字，对 `deepseek-v4-flash` 不再成立。量到
# 200k 没问题，文档说 1M——两个数都写在这里，因为它们证明的不是同一件事：量到的那个
# 证明旧数字已死，文档那个才是这里填的依据。
#
# 万一以后又在低于这个数的地方吃到 400：**这个数就是错的**，改它，并且把新的测量
# 写在这里。上面这两行是它当时的全部依据，不是一个不能质疑的常数。
context_window_tokens = 1000000
# Task nodes and Code turns think and show it (ADR-061); chat shapes pin
# thinking off per request.
#
# 曾经是 `low`，理由是「this profile runs every demo node -- reasoning depth is
# bought at response latency, and the console's job here is to be watchable.」
# 2026-08-26 按用户反馈（「code 模式也不智能」）改回 provider 默认的 `high`：这个
# profile 是控制台实际跑的那个，Code 会话就在它下面，"可观看"不该以"想得浅"为代价。
# 代价没变，仍然是延迟；`turn_timeout_seconds` 同批从 360 提到 600 接住它。
thinking = "enabled"
reasoning_effort = "high"
# 2026-08-27 实测把这个数推翻了。控制台上一次真实运行（v2_general，`work` 节点
# 一次派出三个 analyst 子代理），13 次模型调用里 **5 次死在正好 120.0 秒**，
# 而活下来的最长一次是 **107.0 秒**——已经贴着天花板。同一个库里 `high` 落地
# （2026-08-26）之前的历史是 max 45~77 秒，所以搬动分布的正是 `reasoning_effort`。
#
# **真实的尾巴量不出来**，因为它被这个上限自己截断了：107 是"活下来的最长一次"，
# 不是 p99。所以下面这个数不是分位数，是留给一条看不见的尾巴的余量。
#
# 240 的依据：约 2.2 倍于实测最长成功调用（107.0s），且仍然只有
# `code.turn_timeout_seconds = 600` 的一半——一次卡住的调用吃不掉整个回合，
# 回合超时仍然是外层那道停。
timeout_seconds = 240


[model.compact]
model_id = "deepseek-chat"

[qdrant]
url = "http://localhost:6333"
allow_local_bootstrap = true

[runtime]
record_step_inputs = true
# **这个数和 `[model.main] timeout_seconds` 是一对，只提一个等于没提。**
# `runtime/agent_runtime.py:122` 写着两者的关系：运行时这层是任何单次模型调用的
# 信封，适配器仍会在它**里面**套上 model profile 自己的超时，**短的那个先响**。
# 出厂两个都是 120，所以此前谁先响是一场平局；今天的报错原文
# 「the model call exceeded the runtime's 120.0s envelope」说明响的是这一层。
#
# 300 而不是也写 240：让**更具体**的那个（适配器的）先响，这一层退回它本来的角色
# ——兜底。300 同时是这个部署已经允许的最长单次操作（`sandbox` 工具自报 300）。
model_timeout_seconds = 300

# `max_steps = 40` used to be repeated here (measured on the Word profile:
# a short report hit `budget_exceeded: max_steps` at the then-shipped 12).
# The shipped default now carries that measured value, so restating it would
# be the drift this file warns against elsewhere.

[triage]
# On because this is the profile local acceptance runs against a real provider.
# The deployment-level default stays off until evals/triage has an accuracy
# report for the deployed model (ADR-036).
enabled = true

[rag.reranker]
timeout_seconds = 120

[code]
# On, because the console treats Code as one of its two primary flows -- the
# rail groups it with 工作台 -- and a primary flow that 404s is not a smaller
# console, it is a broken one.
#
# It was reachable before this line only by exporting `AW_CODE__ENABLED` before
# `scripts/dev.sh demo-api`, which is exactly the arrangement the [chat] note
# below argues against: a capability that comes from how you started the
# process rather than from the profile, and disappears on the next restart with
# nothing saying why. Observed as `GET /v1/code/sessions -> 404` from a console
# whose Code page rendered its empty state as though nothing were wrong.
enabled = true

# Shorter than the shipped default, kept in step with config.code-local.toml: a
# local turn that has gone wrong is better cut off in minutes than in ten. 360
# rather than the 240 that shipped with the approval gate, because an ungated
# session actually iterates -- write, run, read, fix, run again -- and 240 was
# sized for turns that spent most of themselves waiting for a human (two 120s
# approvals consumed the whole turn; known-gaps had that measured).
# 2026-08-26 从 360 提到 600（与 `config.default.toml` 的出厂值一致）：同一批把
# `reasoning_effort` 从 `low` 提到了 `high`，而 360 这个数是按 `low` 的回合长度定
# 的。不一起提，就是把"想得更深"直接兑换成"更容易超时"——而超时的回合 `output_text`
# 是空的，连报告都不会写进对话，读者看到的是指令后面一片空白。
turn_timeout_seconds = 600
approval_timeout_seconds = 120

# One at a time, and here the reason is stronger than it is in code-local: this
# profile also runs Chat's embedding and reranking runtimes in the same process.
max_concurrent_turns = 1

# Run code (ADR-057). What this grants is not a shell: `sandbox_run` is a pure
# function -- one container per call, destroyed after, `--network=none`, files
# in and files out, nothing kept between calls.
#
# Two consequences worth knowing before turning it on:
#
#   * The API refuses to start when this is on and the sandbox does not answer.
#     `scripts/dev.sh demo-api` probes it first and says so with the command
#     that fixes it, so the refusal should arrive before the process does.
#   * Calls run without a per-call approval (ADR-058): the default
#     `code.external_requires_approval = false` applies here. The container is
#     the safety story; a deployment that wants the old per-call gate sets
#     that key to true.
sandbox_enabled = true

# 2026-08-26：上面这一行只对**挂了项目的**会话无效，对扁平会话是活的。上一版注释
# 在这里写错过一次，写的是"对 Code 会话是死配置"，来源是把
# `application/code_session.py` 里那句"under config.demo-local.toml, where every
# session has a project"当成了全称——它说的是控制台的用法，不是 API 的约束。
#
# 实测订正（对着这个 profile 起的进程打的真实回合）：一个**不挂项目**建出来的会话，
# act 模式下模型自己列出六个工具——`workspace_list`／`read`／`write`／`edit`／`grep`
# 加上 `sandbox_run`。所以 `sandbox_enabled = true` 在这里买到了东西。
#
# 无效的只是项目那一侧，原因仍在 `CODE_PROJECT_TOOLS_WITH_RUN` 的注释里：
# `sandbox_run` 绑在扁平的 `WorkspaceScope` 上、从 ContextVar 读自己的会话，而项目
# 回合只进 `ProjectFileScope`，所以 `CODE_PROJECT_TOOLS_WITH_SANDBOX` 那两条臂每次
# 调用都在够到沙箱之前就 `SandboxUnavailableError`，因此被删掉了。
#
# 两条路因此是**互补而不是重叠**的，选哪条取决于会话挂不挂项目：
#   * 扁平会话 → `sandbox_run`：一次性容器、`--network=none`、**不能联网**，但脚本
#     写出的文件会存回工作区。这是这个部署里生成 PDF 唯一走得通的路——卡点只是默认
#     镜像 `python:3.12-slim` 里没有 PDF 库，而 `--network=none` 下装不了；
#     `apps/sandbox_mcp/main.py` 的 `--image` 是命令行参数，换个预装镜像即可，代码
#     一行不改。
#   * 项目会话 → `project_run`（下面那一行打开的）：宿主 shell、机器有什么就有什么、
#     **有网**，代价是每一次调用都停下来问人。

# 宿主命令（ADR-077）。**这一行是被人明确批准后才写下的**，不是默认打开。
#
# 为什么这个 profile 需要它：不开，这个 profile 下的一次 Code 会话手上**只有五个
# 工具**——`project_edit`／`project_grep`／`project_list`／`project_read`／
# `project_write`。没有 shell、没有沙箱（见上）、没有联网工具、没有文档渲染。
#
# 2026-08-26 用户报「不能生成 PDF」「连联网搜索都不主动」「不智能」，而模型在会话里
# 自陈「本环境没有多 agent 编排工具，也没有 shell 与网络」。审计确认那不是模型偷懒：
# `CODE_TOOLS` 与 `CODE_PROJECT_TOOLS` 里一个外部工具都没有，它是在如实汇报自己的
# 工具目录。**一个被工具饿着的模型，看起来和一个不聪明的模型是一样的。**
#
# 它授予什么，照抄 config.code-local.toml 的说明：`project_run`，`destructive`
# 风险，项目根目录下每次一条命令，stdin 关闭，120 秒杀掉，而且**每一次调用都会停
# 下来问人，并且把命令原文给那个人看**。它不给 Task 任何东西（Task 没有可问的门），
# 也不给项目不是目录的会话任何东西。
#
# 代价是逐次打断，而这个代价是设计出来的、不是漏掉的：ADR-077 的题目就是「机器上的
# 一条命令在跑之前先被看见」。想要不被打断，正确的做法是把这一行改回 false，而不是
# 去找批量批准——`approve_for_session` 对 destructive／external 是硬拒的
# （`UNREPEATABLE_RISKS`），那条拒绝就是这个门的全部价值所在。
#
# 它同时是这个 profile 里唯一一条能让 Code 会话够到 PDF 生成与网络的路：机器上有
# 什么，命令就能用什么。这不是平台的承诺，是机器的属性——`code_prompt.py` 的
# `_HAS_SHELL` 现在就是这么措辞的，同一批改的。
[policy]
shell_tools_enabled = true

# 一等的联网搜索（ADR-085）。**这一行是被人明确批准后才写下的**，不是默认打开。
#
# **这个文件没有 `[research]` 段**，而投影是一个与（`bootstrap/projections.py`）：
# `policy.search_tools_enabled and research is not None`。所以只有当进程是被
# `scripts/dev.sh demo-api` 起来的——那里 `export AW_RESEARCH__ENABLED=true`，理由写在
# 那个脚本里：`research.enabled` 配在这个被跟踪的文件里会让每一个没有 key 的 checkout
# 启动失败——这件工具才存在。直接 `AW_CONFIG_FILE=... python -m ...main` 起的进程，
# 这个与解析为 false，得到的是**没有这件工具的那套安排**，而不是一个起得来却兑现不了
# 自己 offer 的进程。这句话写在这里，而不是留给下一个人去发现。
#
# 净变化不是天花板也不是审批门，是**有没有人在场**——ADR-085 §1 有实测表：这个
# profile 走 `CODE_PROJECT_TOOLS_WITH_RUN`，天花板本来就是 `destructive`，加 search
# 一格不动。变的是：在这一行之前，Code 要够到网络必须写一条 `curl` 走 `project_run`，
# 而那是 `destructive`、无条件上膛、卡片上是规范化后的真实命令；在这一行之后，
# 够到网络**不再需要任何人在场**，而不可信的网页文本会落进一个握着 `project_write`／
# `project_edit`（`write` 风险，永不上膛）的回合。
search_tools_enabled = true

[sandbox]
# Where `dev.sh sandbox-server` listens. The endpoint is here rather than in
# `[code]` because the sandbox is a process, not a coding-session setting --
# the Task Worker reads the same section for its own `sandbox_run`.
enabled = true

[event_stream]
catchup_poll_seconds = 1

[chat]
# The console's Chat is the routed one, and this file is what says so. It was
# previously exported by a launcher wrapper outside `scripts/`, which made the
# shape a property of *how you started the process* rather than of the profile:
# the wrapper's console searched the web and the `scripts/dev.sh demo-api`
# console documented in docs/running-locally.md did not, and nothing in either
# start said which you had. A profile that names its own capabilities can be
# read; a launcher that adds them cannot.
#
# The threshold below was already here and is only read under this shape, so
# until now it configured a branch this file never selected.
#
# What this costs: `routed` is the one shape that refuses to assemble without a
# reranker -- its cross-encoder score *is* the grounded/ungrounded decision, and
# failing open would answer every question from evidence nothing established the
# relevance of. A checkout without the ML extras gets `RerankerRequiredError` at
# startup rather than a console that silently answers ungrounded. That is the
# right trade for a profile which already requires two MCP servers to be up, and
# it is loud, which is the part that matters.
retrieval_shape = "routed"
routed_relevance_threshold = 0.01

[workflow]
# Off, the same as config.local.toml and config.word-local.toml, and for the
# reason ADR-038 §1 gives: on one person's machine this gate asks the submitter
# to authorise handing a file to themselves, and a confirmation everybody grants
# unconditionally teaches nothing except to click through. ADR-038 §2.1 is what
# permits a deployment to choose this.
#
# The shipped default is now `false` too -- ADR-048 answered §4's request for an
# ADR and changed it. This line is kept rather than deleted because a profile
# that states its own answer does not change meaning when a default moves under
# it, which is the same argument the [chat] note above makes.
#
# Worth knowing when reading this: until v1's `route_quality_gate` was taught to
# read the field, setting it here bought nothing on the research graph. The v1
# router went to `approval` unconditionally, so this profile stopped for an
# approval it had already declined to want.
export_requires_approval = false

# `[multi_agent] max_tokens_per_agent_invocation = 120000` used to be repeated
# here (measured failing at the then-shipped 16000 on both narrow profiles).
# The shipped default now carries the measured value; see config.default.toml.

[optional_labs]
mcp_adapter = true

[[mcp.servers]]
alias = "word"
transport = "http"
endpoint = "http://127.0.0.1:8765/mcp"
tools = ["render_document"]
# Rendering has no durable remote mutation and never touches a caller path. A
# graph-node replay may render another equivalent document to reconstruct the
# ToolResult; byte-for-byte identity is not required by this declaration.
retryable_effects = true
timeout_seconds = 60

[[mcp.servers]]
alias = "web"
transport = "http"
endpoint = "http://127.0.0.1:8767/mcp"
tools = ["fetch_page", "download_document"]
# Both tools are GETs. Reading a page and downloading a file change nothing on
# the other side, so a graph-node replay may make the same request again: it
# gets whatever the URL says at that moment, which is a fresh read rather than a
# second effect. This is the declaration ADR-025 §2.7 requires, not a hope.
retryable_effects = true
# Reading the outside world is research, so these go to `researcher_external`
# and not to the writer (ADR-027 §3.3).
audience = "research"
timeout_seconds = 60
