# Explicit local profile for Code sessions.
#
# Separate from config.local.toml for the same reason config.sandbox-local.toml
# is: turning Code on mounts a second conversational surface that runs agent
# loops inside the API process. That changes what this process spends its own
# capacity on, so it is a profile somebody chooses rather than a default that
# arrives with an upgrade.
#
# This file is one overlay over config.default.toml. DSNs and the provider key
# remain environment-only; no credential belongs here.
#
# Two things must be true before a Code session can do anything useful:
#
#   * A model provider key, the same one Chat needs. Code has no fixed-shape
#     fallback -- a turn is a model loop or it is nothing.
#   * The calling principal must hold `workspace:write`, sent by the console as
#     `x-principal-scopes`. Without it the session still opens and can read its
#     workspace, and every attempt to write one is refused by policy. That is
#     the same rule every other write tool is under; it is named here because a
#     coding agent that cannot write is a confusing thing to debug from the
#     transcript alone.
#
# What this profile deliberately does NOT do: run code. `sandbox_enabled` is
# left at its `false` default here, because `sandbox_run` needs a sandbox MCP
# server that this profile does not ask anybody to start. `config.demo-local`
# turns it on, and `scripts/dev.sh demo-api` probes the server first (ADR-057).

[app]
environment = "development"
deployment_scope = "local"

# Pinned here for the same reason config.local.toml pins them: the shipped
# defaults are placeholders, and `build_model` refuses rather than start a
# process that could not answer.
#
# This file is an overlay over config.default.toml and *not* over
# config.local.toml, so nothing above is inherited from there. Leaving these out
# was not a smaller profile -- it was a dead one. `build_model` raised, the
# whole model half of the process went with it, and `code.enabled = true` two
# lines below turned into a 404 on every /v1/code path with nothing said. The
# warning that now names that case was written from this file getting it wrong.
[model.main]
# The concrete v4 id, not the alias: this profile declares a thinking stance,
# and the stance was probed against this model (ADR-061).
model_id = "deepseek-v4-flash"
# The override every other local profile carries, and the only one whose
# absence stops a turn rather than shaping it. `config.default.toml` sets this
# true for `[model.main]`; combined with `thinking` below, the adapter sends
# `tool_choice: "required"` alongside `thinking: {"type": "enabled"}` and the
# provider refuses the pair outright:
#
#   HTTP 400  "Thinking mode does not support this tool_choice"
#
# So this profile could not complete a single turn -- every one of them ended
# `provider_error`, which reads as a broken key or a retired model id and is
# neither. Measured 2026-08-24 by rebuilding the adapter's own payload and
# posting it; the adapter scrubs provider messages on purpose (they have
# carried a DSN), so the sentence above never reaches a log.
#
# `false` rather than dropping `thinking`: the reasoning is the thing this
# profile is for, and forcing an opening tool call was never what made a coding
# turn reach for its tools -- the prompt is.
tool_calling_required = false
# 实测而非猜测：2026-08-26 直接对 provider 打了一次 `max_tokens=16384` 的请求，
# 回来 `completion_tokens: 11000`、`finish_reason: "stop"`——自然收尾，不是被截断。
# 也就是说 `config.default.toml` 的 8192 是**真的卡着**的，而且这个部署从来没有
# 选过它，它只是默认值。同一批探测里 `max_tokens` 一路给到 200000 provider 都回
# 200，所以"它接受"证明不了上限——只有生成出来的长度算数，16384 是量出来的那个数。
#
# 别往上填没量过的数字：适配器会擦掉 provider 的错误正文（那里出现过 prompt 回显），
# 一个供应商不收的值最后只会变成转录里一句 HTTP 400，指向唯一没出问题的组件。
# 2026-08-28 实测把这个数推翻了，而推翻它的不是「回答写太长」。
#
# 一次 `understand` 回合死在这里：`output_tokens = 16382`，贴着上限；而它吐出来的
# **正文只有 2,127 个字符**（约 1,500 token）。差额约 14,900 token 全是**思考**——
# `thinking = "enabled"` 且 `reasoning_effort = "high"` 时，推理 token 与回答一起
# 记在 `max_output_tokens` 名下（`ModelCompleted` 上那个 `thinking_preview` 字段
# 就是它留下的痕迹）。
#
# 这条要紧在：**没有任何提示词能修它。** 同一批已经把 `understand` 的提示词收紧到
# 「不要在这里解题、整段restatement 控制在 400 词以内」，正文因此从 17,857 字符掉到
# 2,127——收紧生效了，运行照样死。一个框定问题的步骤自己想掉一万四千多 token，是这个
# 推理档位的性质，不是这一段提示词的毛病。
#
# 上面那句「一次编码回合要写的文件很少超过 16384 token」仍然对，只是**量错了对象**：
# 它量的是回答，而这个上限管的是「思考 + 回答」。16384 是在 `reasoning_effort` 还是
# `low` 的时候量的（第二十三批：`max_tokens=16384` 下真吐 11000 token、`stop` 收尾），
# 那一批同时把档位提到了 `high`，却没有回头重量这个数。
#
# 32768 的依据：实测一个**最简单**的节点（框定问题、零工具）就烧掉约 14,900 思考
# token；留一倍余量给真正要动脑的节点。刹车没有取消，只是按它实际要拦的东西重新
# 定了尺寸——同一份 provider 文档把这个模型的 Max Output 记作 384K，仍然**没有取它**，
# 理由不变：它同时是账单的上限。
max_output_tokens = 32768
#
# 同一份文档把这个模型的 Max Output 记作 384K。**没有取它**，而且这是个选择不是
# 遗漏：`max_output_tokens` 除了给长回答留空间，也是跑飞的那一轮唯一的刹车，而
# 一次编码回合要写的文件很少超过 16384 token（约 60KB 文本）。要更大就往上调，
# 只是别忘了它同时是账单的上限。

# 这个部署的模型物理上能装多少（ADR-080）。**查来的 + 量过的，不是猜的。**
#
# 在这之前九个 profile 一个都没有声明它，于是 `domain/runs.py` 的
# `context_reason_for` 直接返回 `None`——ADR-080 的上下文天花板与 ADR-081 的压缩
# **两个都不生效**。后果不是"长会话质量下降"，是这一轮直接死在 provider 的 400 上，
# 而适配器会擦掉 provider 的错误正文，转录里只剩一句 HTTP 400。
#
# 1000000 来自 DeepSeek 自己的 Models & Pricing 页（2026-08-26 读取）：
# `deepseek-v4-flash` 的 Context Length 记作 1M tokens、Max Output 记作 384K。
#
# 为什么不直接照抄文档就完事：这个仓库自己记过一个对不上的数。docs/status.md 第
# 二十一批（ADR-081 复查）写着实测"三次在 70,000 token 打 64,000 的窗口"，终局
# HTTP 400。所以 2026-08-26 直接对 provider 打了两次大输入验证，用的就是这里这个
# model_id：
#
#     900,000 字符 → prompt_tokens = 200089 → HTTP 200
#     400,000 字符 → prompt_tokens =  88977 → HTTP 200
#
# 也就是说那个 64,000 是旧模型时代的数字，对 `deepseek-v4-flash` 不再成立。量到
# 200k 没问题，文档说 1M——两个数都写在这里，因为它们证明的不是同一件事：量到的那个
# 证明旧数字已死，文档那个才是这里填的依据。
#
# 万一以后又在低于这个数的地方吃到 400：**这个数就是错的**，改它，并且把新的测量
# 写在这里。上面这两行是它当时的全部依据，不是一个不能质疑的常数。
context_window_tokens = 1000000
# Code turns stream their reasoning into the console's 思考 block.
#
# 曾经是 `low`，注释写着「`low` keeps the write-run-fix loop responsive; depth is
# a knob, not a promise.」——那个取舍本身没错，错在选的点。2026-08-26 用户的原话是
# 「code 模式也不智能」，而这个 profile 把出厂默认的 `high`（`settings.py` 的
# `reasoning_effort` 默认值）主动调低成了全档最低。一个被调到最低档的推理档位，
# 是"不智能"最先该查的地方，而不是最后。
#
# 代价照旧、并且照旧写在这里：推理深度是拿响应延迟换的，控制台的「可观看」会变差。
# 下面的 `turn_timeout_seconds` 同批从 360 提到 600，就是为了接住这份代价——那个
# 360 是按 `low` 的回合长度定的。要换回响应优先，把这两个一起调回去，不要只调一个。
thinking = "enabled"
reasoning_effort = "high"
# 2026-08-27 实测把这个数推翻了。控制台上一次真实运行（v2_general，`work` 节点
# 一次派出三个 analyst 子代理），13 次模型调用里 **5 次死在正好 120.0 秒**，
# 而活下来的最长一次是 **107.0 秒**——已经贴着天花板。同一个库里 `high` 落地
# （2026-08-26）之前的历史是 max 45~77 秒，所以搬动分布的正是 `reasoning_effort`。
#
# **真实的尾巴量不出来**，因为它被这个上限自己截断了：107 是"活下来的最长一次"，
# 不是 p99。所以下面这个数不是分位数，是留给一条看不见的尾巴的余量。
#
# 240 的依据：约 2.2 倍于实测最长成功调用（107.0s），且仍然只有
# `code.turn_timeout_seconds = 600` 的一半——一次卡住的调用吃不掉整个回合，
# 回合超时仍然是外层那道停。
timeout_seconds = 240


[model.compact]
model_id = "deepseek-chat"

[qdrant]
# `docker run -p 6333:6333`, not the Compose service name -- the same override
# every other `*-local` profile carries, and this one was the only one without
# it. The consequence was that `scripts/dev.sh code-api` could not start on a
# host machine at all: the inherited `http://qdrant:6333` names a hostname that
# resolves only inside the Compose network, so on a machine with a system proxy
# the request went there instead and came back from `verify_qdrant_startup` as
# `ResponseHandlingException: Server disconnected without sending a response`
# -- a message that names neither the hostname nor the proxy. Measured
# 2026-08-24 on this machine, where it took a `[qdrant]`-section diff against
# the five sibling profiles to see it.
url = "http://localhost:6333"
# Same reason as `config.local.toml`: with no collection and no alias, startup
# creates the write collection rather than refusing. A coding session never
# retrieves, but startup verifies the index either way, so a first run against
# a clean Qdrant has to be able to get past it.
allow_local_bootstrap = true

# ADR-077. The one profile in `config/` that turns this on, and the reason is
# what the profile already is: `code-local` is the local-development profile,
# bound to loopback, run by the person whose machine it is, against a project
# directory that same person chose. That is the only arrangement where "run a
# command on this machine" is a thing the operator is asking for rather than a
# thing happening to them -- `demo-local` is the console profile and stays off,
# and so does everything else.
#
# It lives in `[policy]` rather than `[code]`, so `policy_fingerprint` covers
# it: this profile's `policy_identity` differs from every other profile's, and
# every run recorded under it says so. That is deliberate and is most of the
# point of putting the switch here.
#
# What it grants: `project_run`, `destructive` risk, one command per call in
# the project root, stdin closed, killed at 120 seconds, and **every call stops
# and asks a human who is shown the command**. It grants nothing to Task, which
# has no gate to ask through, and nothing to a session whose project is not a
# directory.
[policy]
shell_tools_enabled = true

# 一等的联网搜索（ADR-085）。**这一行是被人明确批准后才写下的**，不是默认打开。
#
# 这个 profile 下面有 `[research] enabled = true`，所以 `bootstrap/projections.py`
# 里那个「旗子为真**且** research 配了」的与直接成立，`web_search` 会真的出现在每个
# Code 回合的工具目录里。
#
# 净变化不是天花板也不是审批门，是**有没有人在场**——ADR-085 §1 有实测表：这个
# profile 走 `CODE_PROJECT_TOOLS_WITH_RUN`，天花板本来就是 `destructive`，加 search
# 一格不动。变的是：在这一行之前，Code 要够到网络必须写一条 `curl` 走 `project_run`，
# 而那是 `destructive`、无条件上膛、卡片上是规范化后的真实命令；在这一行之后，
# 够到网络**不再需要任何人在场**，而不可信的网页文本会落进一个握着 `project_write`／
# `project_edit`（`write` 风险，永不上膛）的回合。
#
# 要收回它就改这一行。别去找批量批准的旁路——`approve_for_session` 对 external／
# destructive 是硬拒的，那条拒绝是设计。
search_tools_enabled = true

[code]
enabled = true

# Shorter than the shipped default, because a local turn that has gone wrong
# is better cut off in minutes than in ten. 360 rather than 240 since ADR-058:
# a session that runs code ungated actually iterates -- write, run, read, fix,
# run again -- and 240 was sized for turns that mostly waited on approvals.
# 2026-08-26 从 360 提到 600（与 `config.default.toml` 的出厂值一致）：同一批把
# `reasoning_effort` 从 `low` 提到了 `high`，而 360 这个数是按 `low` 的回合长度定
# 的。不一起提，就是把"想得更深"直接兑换成"更容易超时"——而超时的回合 `output_text`
# 是空的，连报告都不会写进对话，读者看到的是指令后面一片空白。
turn_timeout_seconds = 600
approval_timeout_seconds = 120

# One at a time locally: a laptop running a model loop, a database and a vector
# store has no capacity to spare, and a second concurrent turn mostly makes the
# first one slower.
max_concurrent_turns = 1

[event_stream]
# How soon a step shows up in the browser, and the shipped default of 10s is
# tuned for a different question.
#
# A durable event reaches a subscriber only through the replay path -- the live
# channel drops durable envelopes on purpose, because one arriving by both
# routes would arrive once with a position and once without, and no client can
# reconcile that. So this poll *is* the latency floor for every step a coding
# session shows.
#
# At 10s a turn that finishes in five seconds displays no steps at all, which
# is precisely the turn a first-time reader tries. Two seconds costs one extra
# event-log query per second per open subscriber, and `max_concurrent_turns`
# above is 1. A deployment that turns Code on inherits the 10s default and
# should make the same trade deliberately -- F-07 in docs/known-gaps.md.
catchup_poll_seconds = 2

[evaluation]
# On for the local profile: the scripts are here and this is the machine they
# were measured on. `max_concurrent_runs` is a frozen 1 in the settings, and
# F-09 records what it does *not* bound -- nothing stops an evaluation and a
# Code turn from wanting the same 8 GB at once.
runs_enabled = true

[research]
# Web search, on. Without it the console's 自由回答 mode has no tool at all and
# a question like「北京今天天气怎么样」gets "我无法提供实时天气信息" -- which reads
# as a product limit and is actually an unset flag. The search runs on the model
# provider's side under the key this profile already needs, so turning it on
# costs no second credential.
#
# It also needs the calling principal to hold `external:search`, which the
# console's default identity does.
enabled = true

# ADR-019. Puts each step's prompt and proposed tool arguments on the run's own
# event stream, the way every other local profile does. Without it
# `argument_preview` is empty, and the step list shows three rows of
# 「写入工作区」with no way to tell which file each one wrote.
[multi_agent]
# 2026-08-28 打开（ADR-089）。这个 profile 是「Code 是这台机器上权限最全的那个
# agent」这句话的落点：它已经拿着项目目录的读写、`project_run`、沙箱与网页检索，
# 而在此之前它是唯一**不能把活分出去**的那一个——委派整条挂在 Task Worker 上，
# API 进程里一行都没有。
#
# ADR-089 把它接进来，并且没有让 Code 加入协调面：委派是同步的、跑在父运行的工具
# 调用里、随进程一起死，正是 Code 已有的前提。子代理是 `explorer`（只读项目目录）
# 与 `analyst`（无工具）——`WORKSPACE_TOOL_NAMES` 那条禁令仍然生效，工作集工具不
# 归子代理持有。
#
# 这里没有 Task 注册表可以记账（也不许有），所以兜着它的是内存里的
# `max_children_per_run` 与 `max_delegation_depth`，随进程消失。
delegation_enabled = true

[runtime]
record_step_inputs = true
# **这个数和 `[model.main] timeout_seconds` 是一对，只提一个等于没提。**
# `runtime/agent_runtime.py:122` 写着两者的关系：运行时这层是任何单次模型调用的
# 信封，适配器仍会在它**里面**套上 model profile 自己的超时，**短的那个先响**。
# 出厂两个都是 120，所以此前谁先响是一场平局；今天的报错原文
# 「the model call exceeded the runtime's 120.0s envelope」说明响的是这一层。
#
# 300 而不是也写 240：让**更具体**的那个（适配器的）先响，这一层退回它本来的角色
# ——兜底。300 同时是这个部署已经允许的最长单次操作（`sandbox` 工具自报 300）。
model_timeout_seconds = 300

