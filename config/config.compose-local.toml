# The profile the Compose stack runs: everything a container topology can
# assemble, declared in one place.
#
# It exists because `config.default.toml` was doing this job by accident. No
# service in `compose.yaml` set `AW_CONFIG_FILE`, so the whole stack loaded the
# shipped defaults -- `[mcp] servers = []`, `optional_labs.mcp_adapter = false`,
# triage, Code and delegation all off. That is a reasonable *default*; it was
# never a decision about what this deployment should be, and it is the reason
# somebody could double-click `scripts\stack.cmd`, watch eleven containers go
# healthy, and get a console with no MCP tool, no Code session and no triage in
# it. The defaults were not wrong. Nothing had chosen.
#
# This is that choice, written down. Since ADR-0106 it also names where the
# retrieval models live -- in the `encoder` service, and in no other process
# -- and since ADR-0107 it leaves the sandbox to be decided per start rather
# than declared absent. Read it beside `config.demo-local.toml`:
# the two describe the same product on two different machines, and the
# differences between them are the differences between a process group on
# somebody's laptop and a container topology. Each difference is commented
# where it appears, because "why does the container profile differ here" is the
# question a reader arrives with.
#
# Like every other overlay, one file over config.default.toml. The DSNs and the
# provider key stay environment-only (`FORBIDDEN_TOML_PATHS`), and the key is
# whatever the console wrote to the shared volume (ADR-101).

[app]
environment = "development"
deployment_scope = "local"
log_level = "INFO"

# `[qdrant]` is deliberately absent. config.demo-local.toml overrides the URL to
# `localhost:6333` because its processes are on the host; the shipped default is
# already `http://qdrant:6333`, which is the service name in this topology. An
# override copied over from that file would point every container at its own
# loopback and break retrieval in a way whose first symptom is a timeout.

[model.main]
# The alias, not the pinned `deepseek-v4-flash` that config.demo-local.toml
# names. That profile pins a concrete id because it declares a thinking stance
# and a stance should name the model it was probed against (ADR-061). This
# profile declares no stance, so it takes whatever the console's key is
# entitled to rather than pinning a target nobody here measured.
model_id = "deepseek-chat"
# Same reason as both narrow profiles: a Task whose scope lacks the matching
# tool must not be forced to open with a tool call.
tool_calling_required = false
# **这个数和下面 `[runtime] model_timeout_seconds` 是一对，只提一个等于没提**
# ——`config.demo-local.toml` 在 2026-08-27 已经把这句话写过一遍，这个 profile 当时
# 没有跟。两处的出厂值都是 120，于是谁先响是一场平局，而运行时那一层先响的结果是
# `provider_error: the model call exceeded the runtime's 120.0s envelope`
# ——可重试，但 Code 回合没有人替它重试，回合就此结束、报告是空的。
#
# 2026-09-12 在这套 Compose 栈上实测到一次：一个编码回合跑到第 48 步、上下文约
# 37k token 时，一次模型调用过了 120 秒，整轮以这句话收场（ADR-0114 §1 记的那个
# 会话的第二轮）。240 照抄 demo-local 的依据：约 2.2 倍于那边实测最长的成功调用，
# 且仍只有 `code.turn_timeout_seconds`（出厂 600）的一半。
timeout_seconds = 240

[runtime]
# 见上面 `[model.main] timeout_seconds` 的注释：这一层是任何单次模型调用的信封，
# 适配器的超时套在它**里面**，短的先响。300 让更具体的那个（适配器的 240）先响，
# 这一层退回它本来的角色——兜底。与 demo-local 同值，理由相同。
model_timeout_seconds = 300

[triage]
enabled = true

[code]
enabled = true
# Off *in this file*, and decided per start by the launcher (ADR-0107) -- the
# same arrangement `research.enabled` has. `SandboxSession.open` is fail-fast
# by design (ADR-057 §3): a session told in configuration that it may run
# code, which then fails per call, is worse than one never offered, so the
# API raises at boot when this is on and the sandbox does not answer. Since
# ADR-0107 this topology *has* a sandbox -- the `sandbox` service, the one
# container holding the Docker socket, reached through a loopback tunnel --
# but it may be pulling its interpreter image, or its socket mount may have
# failed, and a `true` here would turn either into a stack that does not
# come up. So `docker/run-api-local.sh` probes the broker's runtime and
# exports `AW_CODE__SANDBOX_ENABLED=true` when it answers; an explicit value
# from the operator is left alone. Until ADR-0107 the sentence here was "in
# this topology nothing can answer that probe", and it was true.
sandbox_enabled = false
# Where the folder picker opens (ADR-0109). In this topology the API's home
# is `/app` -- the image's own read-only tree, where every folder can be
# chosen and none can be written -- and `compose.yaml` binds the host's
# `var/projects` (or `AGENT_WORKBENCH_PROJECTS_DIR`) at `/projects` for
# exactly this. Named here rather than discovered by the picker, because a
# picker that opened wherever it found a writable directory would be
# guessing at a fact the deployment already knows. The ten native profiles
# leave it unset: there the process runs as the user on the user's machine,
# and the home directory is the right answer.
projects_root = "/projects"
# `browser_enabled` is deliberately absent here and therefore `false` in this
# file -- the same arrangement as `sandbox_enabled` above, for the same
# reason (ADR-0115): `BrowserSlot` is fail-fast at boot, the browser is a
# container that takes its time to become healthy, and `docker/run-api-local.sh`
# probes it through the 8773 tunnel and exports `AW_CODE__BROWSER_ENABLED=true`
# when it advertises `browser_open`. Until 2026-09-12 that tunnel did not
# exist, `api.browser_frame_url` named a port nothing listened on, and F-39
# recorded the browser as "wired but switched off" -- which was half true.

[runner]
# Where `project_run` executes under Compose (ADR-0115): not in this process
# but in the `runner` service -- a container that mounts the same `/projects`
# and holds no key, no database address and no artifact volume. `enabled`
# is deliberately absent here and therefore `false` in this file, decided
# per start like the sandbox and the browser: `docker/run-api-local.sh`
# probes the runner through the 8774 tunnel and exports
# `AW_RUNNER__ENABLED=true` when it advertises `run_command`. A start whose
# runner never answers keeps `project_run` in this process, which is what
# the native launcher does -- and what F-37 refused for this container,
# so the launcher says so on stderr when it happens.
#
# `endpoint` stays at the default `http://127.0.0.1:8774/mcp`: loopback,
# behind the tunnel, so the settings validator sees what it was written to
# admit (ADR-0107 §3.4).

[multi_agent]
delegation_enabled = true

[policy]
# `search_tools_enabled` is the projection's left half; the right half is
# whether `[research]` exists at all, and that is decided at start by
# `docker/run-api-local.sh` probing for a key (ADR-104). So this line offers
# the tool and the launcher decides whether the deployment can honour it --
# rather than this file promising something a keyless stack cannot deliver.
search_tools_enabled = true
# ADR-0115. The second profile in `config/` to turn this on, and the sentence
# that made `code-local` "the one" still holds -- "the only arrangement where
# 'run a command on this machine' is a thing the operator is asking for" --
# because here the command does *not* run on this machine's API process. It
# runs in the `runner` service (`[runner]` above), a container that mounts
# `/projects` and holds no key, no database address and no artifact volume:
# the shape F-37 named when it refused a shell in the API's own container.
# What this line grants is unchanged in every other respect: `project_run`,
# `destructive` risk, one command per call in the project root, stdin
# closed, killed at 120 seconds, and every call stops at a human who is shown
# the command. Should a start find no runner, the launcher says so and
# `project_run` executes in the API container for that start -- the
# arrangement ADR-0109 §3.3 argued against, kept for one start rather than
# made permanent, and visible on the System page's `code.host_commands` row.
shell_tools_enabled = true

# `[sandbox]` is deliberately absent, and its `enabled` is decided the way
# `code.sandbox_enabled` is: `docker/run-api-local.sh` and
# `docker/run-task-worker-local.sh` export `AW_SANDBOX__ENABLED=true` when the
# broker's runtime answers (ADR-0107). The endpoint it would name is the
# shipped default, `http://127.0.0.1:8766/mcp` -- loopback, because each
# container reaches the broker through a tunnel that listens on its own
# 127.0.0.1:8766 (`docker/loopback_proxy.py`). Written here as a table it
# would have to say `enabled = true`, and that is the value that stops a
# stack whose broker is still pulling its image.

# The encoder service (ADR-0106). Both leaves, because each factory reads
# only its own section; one process serves all three models. `encoder` is
# the service name on the Compose network, and plain HTTP to it is allowed on
# the same terms as `http://qdrant:6333` above: tenant text on a private
# network, no credential.
[rag.embedding]
service_url = "http://encoder:8769"

[rag.reranker]
service_url = "http://encoder:8769"

[optional_labs]
mcp_adapter = true

# The two servers below run as loopback sidecars inside each Task Worker
# container, started by `docker/run-task-worker-local.sh` before it execs the
# Worker. Sidecars rather than their own Compose services, and the endpoints
# below are why it is not a free choice: reaching a server across the container
# network would have to break three separate guards -- each server's `--host`
# is an argparse whitelist of loopback addresses, the MCP SDK turns on Host
# header validation precisely because the host is loopback, and
# `MCPServerSettings.validate_endpoint` requires HTTPS for any non-loopback
# endpoint. Three code changes to reach a topology that buys nothing here: both
# servers are stateless, and the only process that connects to them is the
# Worker.
#
# The API loads this same file and never connects to either. It reads
# `[[mcp.servers]]` to write tool names into each Task's authorization envelope
# at submission and to report `task.mcp_tools` on the System page; the one MCP
# connection the API makes is to the sandbox, when its launcher decided it on.
[[mcp.servers]]
alias = "word"
transport = "http"
endpoint = "http://127.0.0.1:8765/mcp"
tools = ["render_document"]
retryable_effects = true
timeout_seconds = 60

[[mcp.servers]]
alias = "web"
transport = "http"
endpoint = "http://127.0.0.1:8767/mcp"
tools = ["fetch_page", "download_document"]
retryable_effects = true
# Reading the outside world is research, so these reach `researcher_external`
# and not the writer (ADR-027 §3.3).
audience = "research"
timeout_seconds = 60

[[mcp.servers]]
alias = "browser"
transport = "http"
# Loopback, and reached through the tunnel `docker/loopback_proxy.py` opens
# in this container -- the browser itself is bound to loopback in its own
# container, so the settings validator, the SDK's Host check and the
# server's `--host` choice list all see what they were written to see
# (ADR-0113 §2.4, the shape ADR-0107 established).
endpoint = "http://127.0.0.1:8773/mcp"
tools = [
  "browser_open",
  "browser_snapshot",
  "browser_eval",
  "browser_interact",
  "browser_screenshot",
  "browser_diagnostics",
]
# `false`, unlike `word` and `web` above: `browser_interact` clicks things,
# `browser_eval` can mutate the page it runs in, and `browser_diagnostics`
# drains its buffers. The declaration is per server and one non-replayable tool
# makes the server non-replayable (ADR-0113 §3.4, ADR-025 §2.7).
retryable_effects = false
audience = "research"
timeout_seconds = 120
