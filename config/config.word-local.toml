# Explicit local profile for the Word MCP demonstration.
#
# This is intentionally separate from config.local.toml. MCP tool names are
# frozen into every newly submitted Task envelope, so enabling Word in the
# ordinary local profile would silently widen every Work task. Use the matching
# `scripts/dev.sh word-*` commands when (and only when) demonstrating Word.
#
# Like config.local.toml, this file is one overlay over config.default.toml.
# The DSNs and provider key remain environment-only and are exported by
# scripts/dev.sh / the caller; no credential belongs here.

[app]
environment = "development"
deployment_scope = "local"
log_level = "INFO"

[model.main]
model_id = "deepseek-chat"
# The ordinary baseline may force one opening tool call. That is unsafe for an
# opt-in capability: a Task without mcp:word would be forced to propose a tool
# it cannot use. In this profile the writer chooses Word when the objective
# asks for a document; unrelated Work remains usable.
tool_calling_required = false

[model.compact]
model_id = "deepseek-chat"

[qdrant]
url = "http://localhost:6333"
allow_local_bootstrap = true

[runtime]
record_step_inputs = true
# The shipped 12 is sized for a node that reads its inputs and answers. v2's
# `work` node does the whole job in one invocation, and this profile's job has
# a rendering round trip in it: measured here, a short report spent its steps
# on list -> write -> render -> re-render after the reviewer's note and hit
# `budget_exceeded: max_steps` before finishing. Raised for this profile only;
# every other node still answers well inside 12.
max_steps = 40

[rag.reranker]
timeout_seconds = 120

[event_stream]
catchup_poll_seconds = 1

[chat]
routed_relevance_threshold = 0.01

[workflow]
# Off for the reason config.local.toml states at length: on one person's
# machine the gate asks the submitter to authorise handing a file to
# themselves. This is the profile whose whole point is producing a .docx to
# download, so it is the profile where that formality is most in the way.
export_requires_approval = false

[multi_agent]
# The same correction config.web-local.toml already carries, for the same
# reason and a different node. v2's `work` node holds the whole tool set and
# writes the document in one invocation, and the shipped 16000 is a
# *cumulative* per-invocation ceiling: measured here, a Task asked for a short
# report with one table hit `budget_exceeded: token_budget` while every tool
# call had worked -- the node never got as far as rendering anything.
#
# It stays 16000 everywhere else on purpose -- every other node reads nothing
# bigger than its own projection.
max_tokens_per_agent_invocation = 120000

[optional_labs]
mcp_adapter = true

[[mcp.servers]]
alias = "word"
transport = "http"
endpoint = "http://127.0.0.1:8765/mcp"
tools = ["render_document"]
# Rendering has no durable remote mutation and never touches a caller path. A
# graph-node replay may render another equivalent document to reconstruct the
# ToolResult; byte-for-byte identity is not required by this declaration.
retryable_effects = true
timeout_seconds = 60
