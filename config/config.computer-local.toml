# Explicit local profile for computer use (ADR-070).
#
# Separate from every other local profile, and more deliberately so than the
# rest. `config.sandbox-local.toml` is separate because enabling `sandbox_run`
# raises every new Task's risk ceiling; this one is separate because the tools
# it registers can **move the cursor and press keys on the machine the Worker
# is running on**. That is not a capability to fold into a profile somebody
# selects for another reason.
#
# This file is one overlay over config.default.toml. DSNs and the provider key
# remain environment-only; no credential belongs here.
#
# Four things must already be true before this profile does anything:
#
#   uv sync --extra computer-use      # pyobjc; macOS only, not installed by default
#   scripts/build_computer_app.sh     # the signed .app the server has to run
#                                     # inside -- see below, it is not packaging
#                                     # taste (ADR-092)
#   scripts/dev.sh computer-server    # builds the .app and starts it, on
#                                     # 127.0.0.1:8768
#   System Settings > Privacy & Security > Screen Recording, and
#   > Accessibility, both granted **to that .app** -- macOS keys the grants on
#   the bundle id and code signature, so a grant given to your terminal does
#   not carry over to it
#
# The .app is the part that surprises people. macOS lets a process change which
# application is frontmost only when four things hold at once: a bundle
# identity, a code signature, the Accessibility grant, and a live main-thread
# run loop. Measured 2026-08-29, removing one at a time: 0/20, 0/10, 0/10,
# 0/15 -- and with all four, 15/15. Every one of those failures is silent, so a
# server started any other way hands out an `activate_application` that reports
# success and moves nothing (ADR-092).
#
# If any of them is missing the server exits at startup with a message naming
# the one that is missing, and an MCP client is handed no screen tool at all --
# rather than tools that post events nothing receives, which is what macOS does
# to a process without the Accessibility grant: `CGEventPost` returns success
# having done nothing.
#
# Satisfying all three does not put these tools into a Task, and nothing here
# ever will: `retryable_effects = false` below keeps them out of every Task
# authorization envelope and out of the Worker's registry, at both ends. They
# are reached by speaking MCP to this server -- `scripts/dev.sh computer-check`
# is a working example -- which is also why there is deliberately no
# `computer-api` / `computer-worker` pair to start.
#
# What this profile does NOT do is decide which applications may be touched.
# That is a per-session decision the person makes through `request_access`, and
# it starts empty every time the server restarts. Since ADR-091 the same
# decision also settles which of the approved applications the model may bring
# to the front -- and, just as deliberately, this file has no say in that
# either: `activate_application` refuses whenever the window in front is one
# nobody approved, which is a fact about this moment that no configuration file
# can know.

[app]
environment = "development"
deployment_scope = "local"
log_level = "INFO"

[model.main]
model_id = "deepseek-chat"
# Same reason as config.web-local.toml: forcing an opening tool call is unsafe
# for an opt-in capability, and a Task without the screen scope would be made
# to propose a tool it cannot use.
tool_calling_required = false

[model.compact]
model_id = "deepseek-chat"

[qdrant]
url = "http://localhost:6333"
allow_local_bootstrap = true

[runtime]
record_step_inputs = true

[event_stream]
catchup_poll_seconds = 1

[optional_labs]
mcp_adapter = true

[[mcp.servers]]
alias = "computer"
transport = "http"
endpoint = "http://127.0.0.1:8768/mcp"
tools = [
  "request_access",
  "list_granted_applications",
  "activate_application",
  "screenshot",
  "left_click",
  "type",
  "key",
  "scroll",
]
# `false`, and this is the one declaration in this file that is not a
# convenience. ADR-025 §2.7 asks whether a graph-node replay may repeat these
# calls. It may not: a click is not a GET. Replaying `left_click` presses the
# button a second time, and the second press lands on whatever is under the
# cursor *now*, which is not what was there when the first one was authorized.
#
# What it *causes* is a refusal at both ends of the Task path:
# `configured_mcp_tool_names` (bootstrap/projections.py:144) skips a
# non-retryable server, so no name declared above ever enters a Task
# authorization envelope; and the Worker logs `mcp_server_skipped_nonretryable`
# (apps/task_worker/composition.py:871) and binds none of them. Measured
# 2026-08-23: a Worker on this profile comes up holding zero MCP tools.
#
# Until 2026-08-23 that pair of refusals was incidental -- two `continue`
# statements, asserted by no test that reads this profile, so deleting either
# one would have widened every Task submitted here by every screen-control tool
# and broken nothing. ADR-075 makes it the decision instead:
# a non-retryable MCP tool reaches a Task only through a deterministic node
# that issues the call itself, never by model proposal.
# `tests/config/test_local_computer_profile.py` is what turns undoing it into
# a failing test -- no screen name in the envelope, and the risk ceiling stays
# `write` rather than being raised to `external`, which any non-empty MCP name
# list would do to every Task here, including the ones that never touch a
# screen.
retryable_effects = false
# `synthesis`, not `research`. Reading the outside world is research and
# goes to `researcher_external`; driving an application is doing the work,
# and the work is the writer's (ADR-027 §3.3).
audience = "synthesis"
# A screenshot is a full-screen grab, a scale and a JPEG encode -- tens of
# milliseconds. The ceiling is here for a machine under load, not for the
# ordinary case.
timeout_seconds = 30
