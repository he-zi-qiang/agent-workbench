# Running on a developer machine, against services on localhost.
#
#   AW_CONFIG_FILE=config/config.local.toml agent-api --without-chat
#
# config.default.toml is loaded first; this file deep-merges over it. It exists
# because the defaults are written for the Compose topology -- Qdrant answers to
# the hostname `qdrant`, and nothing may create an index by accident -- and both
# of those are wrong for a process started by hand beside `docker run`.
#
# The three DSNs are deliberately absent. Settings forbids them in TOML, because
# a connection string in a committed file is a credential in a committed file
# even when today's happens to have no password. They come from the environment;
# scripts/dev.sh is the one place that knows them.
#
# The model ids below are pinned because the defaults ship placeholders, and
# `build_model` refuses to start a process that could not answer. The *key* is
# still absent and still comes from the environment: a model id is the provider's
# public catalogue name, and an API key is not.
#
#   AW_CONFIG_FILE=config/config.local.toml \
#   AW_SECRETS__DEEPSEEK_API_KEY=sk-... agent-api
#
# Without that variable the process still refuses to start, which is the point:
# there is no configuration in this repository that makes chat work by itself.

[app]
environment = "development"
deployment_scope = "local"
log_level = "INFO"

[model.main]
# DeepSeek's catalogue name, pinned. The answering profile.
model_id = "deepseek-chat"

[model.compact]
# History compaction. The same model here: DeepSeek has no cheaper small tier
# worth pinning separately, and a second id nobody verified would be a config
# value that only fails once a conversation grows long enough to compact.
model_id = "deepseek-chat"

[qdrant]
# `docker run -p 6333:6333`, not the Compose service name.
url = "http://localhost:6333"
# The one setting that makes a first run possible: with no collection and no
# alias, startup creates the write collection to the configured schema and binds
# the read alias to it. Never inferred, and settings refuses it outside a local
# scope -- an operator typo must not produce a fresh empty index in production.
#
# The *ingestion worker* is what performs it. An API started `--without-chat`
# builds no Qdrant client at all, because it does not retrieve; start the
# ingestion worker at least once before expecting an index to exist.
allow_local_bootstrap = true

# Web search (ADR-020 for Task, ADR-021 for Chat's routed fallback) is
# deliberately NOT enabled here, even though this is the local profile.
#
# `research.enabled` without a provider key is a startup error by design, and
# this file is tracked: turning it on would break the keyless path scripts/dev.sh
# documents and supports ("no AW_SECRETS__DEEPSEEK_API_KEY: search without
# chat"). One developer having a key is not a reason every checkout needs one.
#
# Turn it on for a session that has the key, from the shell that has it:
#
#   export AW_SECRETS__DEEPSEEK_API_KEY=sk-...
#   export AW_RESEARCH__ENABLED=true
#
# Or flip it on the console's System page (ADR-103): that is stored beside the
# key file for the *next* start, ranks below an exported value and above this
# file, and every launcher -- the container's and `dev.sh`'s console arms
# (ADR-104) -- leaves the decision to it.

# ADR-019. Puts each step's prompt and proposed tool arguments on the run's own
# event stream, so opening a step in the UI shows what the model was actually
# asked -- which is the point of being able to open a step at all. On here and
# nowhere else: this is one developer's machine reading its own runs, and the
# default stays off because storing users' prompts is a deployment's decision.
[runtime]
record_step_inputs = true

# This machine reranks with bge-reranker-v2-m3 on MPS, and one query over eight
# passages does not finish in the shipped 15 seconds. That matters more here
# than it looks: chat.retrieval_shape is `routed`, and there the reranker score
# *is* the grounded/ungrounded decision -- a timeout fails open to "no score",
# which routed reads as "not relevant", so every RAG turn silently fell back to
# an ungrounded answer. Raised for local hardware only; the shipped default
# stays 15s.
[rag.reranker]
timeout_seconds = 120

# The SSE stream re-reads the event log on this interval; the shipped 10s is
# sized for a browser watching a long Task, where nobody notices. The terminal
# REPL folds each stage to a line as it happens, and at 10s a short turn is
# over before the first poll -- the run looks like it did nothing. One second
# on a local single-user process, where the extra reads cost nothing.
[event_stream]
catchup_poll_seconds = 1

# Measured against kb_local with scripts/check_routed_threshold.py, not chosen.
# The cross-encoder scores separate the two groups cleanly but not widely: the
# weakest on-topic question scored 0.0325 and the strongest off-topic one
# 0.00644, so the whole decision lives in a band about five times wide. 0.01
# sits inside it.
#
# Not the geometric middle (0.0145), deliberately. The two errors are not worth
# the same: a wrongly *rejected* on-topic question answers from the model's
# memory about documents this deployment actually holds -- the failure RAG
# exists to prevent, per RoutedExecution's own docstring -- while a wrongly
# *accepted* off-topic one only produces a RAG refusal. So the margin is spent
# on the dangerous side: 3.2x of headroom below the weakest on-topic score,
# 1.6x above the strongest off-topic one.
#
# The shipped default stays 0.0 because this number is a property of kb_local,
# not of the software; config.default.toml says as much. Re-measure when the
# corpus changes -- the band was five times wide on ten questions over a
# two-topic corpus, which is calibration, not a guarantee.
#
# For the record, the previous 0.3 was not a small miss: it rejected four of
# seven on-topic questions, including one the corpus answers verbatim.
[chat]
routed_relevance_threshold = 0.01

[triage]
# On for the same reason web-local turns it on: this machine has a real
# provider key and is where local acceptance runs. The shipped default stays
# off until evals/triage has an accuracy report for the deployed model
# (ADR-036).
enabled = true

[workflow]
# One person's machine, where the person who submits a Task is the same person
# who would approve its export and the only one who can read the result. The
# gate asks them to authorise handing a file to themselves, which is a
# formality -- and a formality on every Task is how approving without looking
# becomes a habit. Off here; the shipped default stays true.
#
# It does not widen anything: export writes into this tenant's own artifact
# store under the same per-principal authorization as before, and the bytes
# reach nobody until someone clicks download.
export_requires_approval = false
