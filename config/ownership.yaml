    {
      "owner": "adapters.persistence.guard_runner",
      "lifecycle": "live",
      "fields": [
        "database.guard_disconnect_action",
        "database.guard_healthcheck_seconds"
      ]
    },
    {
      "owner": "adapters.persistence.event_listener",
