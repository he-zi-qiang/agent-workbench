      "fields": [
        "chat.retrieval_shape",
        "chat.max_agentic_steps",
        "chat.max_agentic_searches"
      ]
    },
    {
      "owner": "adapters.persistence.connection_factory",
      "lifecycle": "startup",
      "fields": [
        "database.dsn",
        "database.query_pool_mode",
        "database.query_pool_size",
        "database.query_pool_max_overflow",
        "database.operational_connection_reserve",
        "database.statement_timeout_ms",
