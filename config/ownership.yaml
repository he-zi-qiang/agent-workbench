{
  "schema_version": 1,
  "allowed_lifecycles": [
    "startup",
    "live",
    "task_snapshot",
    "test_only",
    "lab"
  ],
  "task_snapshot_allowlist": [
    "app.config_schema_version",
    "app.architecture_baseline",
    "model.provider",
    "model.main.*",
    "model.compact.*",
    "runtime.*",
    "langchain_adapter.*",
    "workflow.*",
    "multi_agent.*",
    "rag.*",
    "qdrant.collection_schema_version",
    "qdrant.distance"
  ],
  "derived_task_snapshot_values": [
    "resolved_qdrant_collection",
    "resolved_qdrant_index_version",
    "resolved_qdrant_index_generation_id"
  ],
  "groups": [
    {
      "owner": "bootstrap.processes",
      "lifecycle": "startup",
      "fields": [
        "app.name",
        "app.environment",
        "app.deployment_scope",
        "app.log_level",
        "app.debug"
      ]
    },
    {
      "owner": "bootstrap.settings",
      "lifecycle": "task_snapshot",
      "fields": [
        "app.config_schema_version",
        "app.architecture_baseline"
      ]
    },
    {
      "owner": "apps.api.server",
      "lifecycle": "startup",
      "fields": [
        "api.host",
        "api.port",
        "api.shutdown_grace_seconds",
        "api.document_upload_transport"
      ]
    },
    {
      "owner": "apps.api.request_limits",
      "lifecycle": "live",
      "fields": [
        "api.request_timeout_seconds",
        "api.max_control_request_body_bytes"
      ]
    },
    {
      "owner": "apps.api.sse",
      "lifecycle": "live",
      "fields": [
        "api.sse_heartbeat_seconds"
      ]
    },
    {
      "owner": "application.chat.recovery",
      "lifecycle": "live",
      "fields": [
        "chat.orphan_grace_seconds",
        "chat.reaper_poll_seconds",
        "chat.reaper_batch_size",
        "chat.disconnect_poll_seconds"
      ]
    },
    {
      "owner": "bootstrap.settings.chat_recovery_contract",
      "lifecycle": "startup",
      "fields": [
