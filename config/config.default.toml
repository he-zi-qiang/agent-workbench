# Agent Workbench v1 configuration baseline.
#
# This file is committed to source control and must contain no real secret.
# Deployment-specific values override it through AW_* environment variables.
# Nested keys use "__", for example:
#   AW_COORDINATION__LEASE_DURATION_SECONDS=120

[app]
name = "agent-workbench"
environment = "development"
# "local" permits an unauthenticated Compose Qdrant; any remote scope does not.
deployment_scope = "local"
log_level = "INFO"
debug = false
config_schema_version = "1.19"
architecture_baseline = "1.3"

[api]
# Loopback only, and validated as such: the identity resolver reads request
# headers, so any reachable interface is one where callers name themselves.
host = "127.0.0.1"
port = 8000
request_timeout_seconds = 180
sse_heartbeat_seconds = 15
shutdown_grace_seconds = 30
# JSON/metadata control plane only; document bytes use ArtifactStore data plane.
max_control_request_body_bytes = 2097152
document_upload_transport = "artifact_data_plane"
# 屏幕控制服务器的只读出口，控制台那块面板经由 /v1/computer/session 转发到这里
# （ADR-095 §5）。指到别的机器会被拒绝：那会让这个进程转述别人的屏幕。
#
# 这台服务器**默认不启动**，所以读不到是常态而不是故障——那一侧的界面把「读不到」
# 和「读到了、名单是空的」显示成两件事。
computer_session_url = "http://127.0.0.1:8768/session"

[chat]
# A Chat request has one fixed execution lease. Expiry terminalizes the Turn;
# it never transfers or automatically replays an uncheckpointed model run.
orphan_grace_seconds = 15
reaper_poll_seconds = 15
reaper_batch_size = 100
disconnect_poll_seconds = 1
orphan_action = "terminal_fail"
automatic_retry = false
# "fixed" retrieves once and hands the model the evidence; "agentic" gives it a
# search tool and lets it decide when to look. The default is the one that can
# be evaluated -- see bootstrap.settings.ChatSettings for why.
# "ungrounded" (ADR-018) answers from the model alone: no retrieval, no
# citations, no publish fence. It is a different promise, not a weaker one, and
# the capability table has to say so separately.
retrieval_shape = "fixed"
max_agentic_steps = 4
max_agentic_searches = 6
# Only read when retrieval_shape = "routed". A cross-encoder score, not a
# retrieval score: RRF is a rank sum and cannot say whether a hit is relevant.
# Uncalibrated -- measure it against your own corpus before trusting it.
routed_relevance_threshold = 0.0

[code]
# A coding session: one conversation, a workspace, and no coordination plane.
# Off by default because it adds a surface rather than changing one.
enabled = false
# Frozen premises, not preferences. Code runs where the human answering an
# approval can reach the coroutine that is waiting, and nowhere else; a second
# locality would need a way to deliver that answer across processes, and there
# is none. Widening either is an ADR, not a line in this file.
execution_locality = "in_api_process"
coordination = "none"
# The wall clock for one turn, which becomes the run's deadline -- a code run
# is required to carry one, because nothing else is watching it. The approval
# allowance must stay below it, or one held call could consume the whole turn.
turn_timeout_seconds = 600
approval_timeout_seconds = 300
# Independent ceilings (ADR-022): fewer tool calls than steps says "this many
# tool calls, and a turn left over to write the report from them".
max_steps = 60
max_tool_calls = 120
# How many turns this process runs at once, across all sessions. A turn holds a
# model connection and a workspace for minutes.
max_concurrent_turns = 4
# Whether a coding session may call `sandbox_run` (ADR-057). Off by default,
# because it needs a sandbox MCP server on the other end and a container
# runtime under that; a deployment without either should hear a refusal at
# startup rather than at the first attempt to run code.
#
# What it grants is not a shell. ADR-029's sandbox is a pure function: one
# container per call, destroyed after, `--network=none`, files in and files
# out. The field was called `shell_enabled` and was frozen for as long as
# nothing was wired to it.
sandbox_enabled = false

[triage]
# Submission-time shape triage (ADR-036): one structured model call proposes
# which pipeline an objective runs and whether it wants a file, asking the
# submitter only when the graph is genuinely ambiguous. Disabled means the
# endpoint answers "default" and clients submit exactly what they always have.
# Turn it on only after evals/triage reports this deployment's model accuracy.
enabled = false
# Bounds the whole call, corrective turn included; the create form waits on it.
timeout_seconds = 8.0

[database]
# dsn, guard_dsn and listen_dsn are secret-like deployment values and are
# intentionally absent. Supply them through .env / secret injection.
query_pool_mode = "direct"
guard_pool_mode = "direct"
listen_pool_mode = "direct"
query_pool_size = 10
query_pool_max_overflow = 10
guard_connection_budget = 4
listener_connections_per_process = 1
operational_connection_reserve = 10
statement_timeout_ms = 30000
application_name = "agent-workbench"
guard_connection_scope = "task_pinned"
listen_connection_scope = "process_pinned"
guard_disconnect_action = "cancel_and_reclaim"
guard_healthcheck_seconds = 5
listener_healthcheck_seconds = 30

[coordination]
registry_backend = "postgresql"
claim_strategy = "skip_locked"
# How many Tasks *one* Worker process runs at once (ADR-024). Raising it costs
# one guard connection and one concurrent provider call per lane, so the
# default stays 1 and the ceiling is `database.guard_connection_budget`, which
# Settings cross-validates.
#
# Multi-*process* claiming is still not claimed to work. That is the question
# the lease epoch exists for, and nothing here tests two processes against each
# other; this number is process-local and says nothing about that.
worker_concurrency = 1
claim_batch_size = 1
claim_poll_interval_ms = 1000
claim_poll_jitter_ms = 250
lease_duration_seconds = 90
heartbeat_interval_seconds = 20
lease_grace_seconds = 10
max_missed_heartbeats = 2
recovery_poll_seconds = 15
# How many synchronous adapter calls (embedding, reranking, artifact reads) may
# occupy threads at once, and how long a caller waits for one of those slots
# before giving up. ADR-042. Two, because one torch forward already uses the
# cores it was given and a third slot buys nothing. The timeout bounds only the
# wait for a slot, never the call itself.
blocking_call_slots = 2
blocking_call_queue_timeout_seconds = 30.0
priority_aging_seconds = 300
max_attempts = 5
retry_base_seconds = 2
retry_max_seconds = 60
advisory_lock_enabled = true
require_same_physical_session = true
fenced_checkpointer_enabled = true
tool_execution_ledger_enabled = true
strict_fifo_required = false
lease_time_source = "postgresql_clock"
fencing_token_strategy = "monotonic_lease_epoch"
advisory_lock_key_strategy = "stable_signed_int64"
heartbeat_execution = "independent_task"

[event_stream]
store_backend = "postgresql"
wakeup_backend = "postgres_listen_notify"
replay_source = "run_events"
notify_payload_mode = "cursor_only"
notify_payload_limit_bytes = 7900
listener_uses_dedicated_session = true
# Must match `notifications.TASK_READY_CHANNEL`, because the sender writes that
# constant and reads no configuration. This said `agent_task_ready` while the
# sender said `task_ready`, which cost nothing for as long as nobody listened --
# and became a warning on every Worker start the moment somebody did. A default
# that logs "your configuration is ignored" trains readers to ignore the log, so
# the default agrees and the warning is kept for deployments that really do
# configure a different name.
task_ready_channel = "task_ready"
# No listener consumes this one yet, so it names nothing. Left as-is rather than
# guessed at: the value should be decided by whoever writes the SSE listener.
stream_ready_channel = "agent_stream_ready"
replay_page_size = 500
# What one live subscriber may hold while it is not reading, and how many live
# subscribers one stream may have. Transient events are never written anywhere,
# so these two numbers are the whole bound on what the API process keeps on
# behalf of slow readers. Four per stream is a browser tab, a reconnect that
# has not been reaped yet, and slack.
subscriber_buffer_events = 256
max_live_subscribers_per_stream = 4
catchup_poll_seconds = 10
# Model deltas are live SSE only; durable events store structured/final content.
model_delta_mode = "ephemeral_sse_coalesced"
live_delta_coalesce_ms = 50

[model]
provider = "deepseek"
# DeepSeek speaks an OpenAI-compatible protocol; a compatible gateway or a
# local server can be pointed at here instead. Anything but loopback must be
# HTTPS, because every request carries the provider API key.
base_url = "https://api.deepseek.com"

[model.main]
# Exact provider model IDs must be supplied by deployment config and pinned.
model_id = "not-configured-deepseek-main"
temperature = 0.0
max_output_tokens = 8192
# 适配器给单次请求的超时（`adapters/models/deepseek.py:306`）。它与
# `[runtime] model_timeout_seconds` 是**一对**，两个出厂都是 120，**只提一个
# 等于没提**——短的那个先响。这条耦合此前没有写在任何一侧，代价实测过一次：
# 见 `config.demo-local.toml` 的 `[model.main]`。
#
# 这里仍然留 120，不是因为 120 是对的，而是因为**这里没有可依据的测量**：出厂
# `model_id` 是占位符 `not-configured-deepseek-main`，一个占位模型的调用时长这
# 个仓库编不出来。与 `pricing`、`context_window_tokens` 拒绝出厂值同一条规则。
#
# 但有一件事值得警惕：`reasoning_effort` 的**出厂默认已经是 `high`**
# （`settings.py:560`），而 120 这个数是在它还是别的档位时定的。所以任何一个
# 不覆盖这两处的部署，拿到的就是"出厂就想得深、出厂就来不及"这个组合。
timeout_seconds = 120
max_retries = 2
# Require a tool on the opening provider turn only. After its ToolResult the
# adapter keeps tools available but returns tool_choice to auto.
tool_calling_required = true
prompt_cache_enabled = true
# context_window_tokens: how much one request to this model may hold (ADR-0080).
# Not shipped, because `model_id` above is a placeholder and a window is a fact
# about a real provider -- see docs/configuration.md. Without it there is no
# context ceiling and an over-long turn dies as a provider 400.

[model.compact]
model_id = "not-configured-deepseek-compact"
temperature = 0.0
max_output_tokens = 2048
timeout_seconds = 45
max_retries = 2
tool_calling_required = false
prompt_cache_enabled = true

[runtime]
executor = "claude_like"
# 40, not the 12 that shipped: config.demo-local.toml measured the 12 failing
# on ordinary work -- a short report spent its steps on list -> write ->
# render -> re-render after the reviewer's note and hit `budget_exceeded:
# max_steps` -- and every profile that actually ran Tasks had to override it.
# A default that every real deployment must raise is a trap, not a default;
# the hard stop against runaway loops is still here, just sized to the
# measured shape of one node's work.
max_steps = 40
max_tool_calls = 32
max_parallel_read_tools = 4
max_parallel_write_tools = 1
# 运行时给任何单次模型调用的信封。**与 `[model.<profile>] timeout_seconds` 成对，
# 短的那个先响**（`runtime/agent_runtime.py:122`）；出厂两个都是 120，于是谁先响
# 是一场平局，而只改其中一个不会把墙挪开一寸。
model_timeout_seconds = 120
# A deployment-wide ceiling on any single tool call. Unset, and each tool is
# bound only by the timeout it declares for itself, which is the sizing that
# knows what the tool does: `sandbox` asks for 300 and `web_search` for 120.
# Setting this can only shorten a call, never lengthen one, so it is not the
# way to give a tool more time -- raise that tool's own declared timeout.
# It read 60 until 2026-08-13 and no code consumed it, so setting it did
# nothing; leaving it unset keeps that behaviour rather than newly cutting
# every long tool down to a number nobody had been running against.
# tool_timeout_seconds = 60
cancellation_poll_seconds = 1
context_soft_limit_ratio = 0.75
# Whether a run that reaches that ratio shortens its own conversation instead
# of stopping at it (ADR-0081). Off by default, and the order matters: ADR-0080
# made an over-long run stop and say which ceiling it hit, and a deployment
# that has not yet seen a real `context_limit` has nothing to tune this
# against. Honest failure first, remedy second.
#
# Turning it on costs one extra model call per compaction, billed under the
# [model.compact] profile and metered on the run that made it. It only ever
# fires beside a profile that declared `context_window_tokens` -- with no
# window there is nothing to be over -- so on a deployment that declared none
# this decides nothing at all.
context_compaction_enabled = false
tool_result_artifact_threshold_bytes = 65536
write_tools_default_enabled = false
# ADR-019. Puts the prompt and the proposed tool arguments on the run's event
# stream, so a step can be opened and read. Only the principal that owns the
# Task or Session can read that stream. Not the same switch as
# observability.record_prompt_body, which stays false and governs OTel export.
# Off by default: it changes what this deployment stores about its users.
record_step_inputs = false

[langchain_adapter]
enabled = true
allowed_scope = "model_and_tool_adapters"
agent_executor_enabled = false
memory_enabled = false

[workflow]
control_plane = "langgraph"
checkpointer_backend = "postgresql"
checkpointing_enabled = true
human_interrupt_enabled = true
# Whether a Task's export waits for a human (ADR-031 §2.4, ADR-038, ADR-048).
# False here since ADR-048: the graph routes review -> export with no approval
# row opened, no approval_id written and no "approved" decision fabricated, and
# the report header says "not required by this deployment".
#
# What export writes is a versioned artifact in this tenant's own store, behind
# the same per-principal authorization as everything else -- nothing reaches
# anyone until a human clicks download, and that download is its own authorized
# read. A multi-person deployment that wants somebody other than the author to
# look first sets this true; the decision is then answered inside the Task that
# is waiting, which is where it has always been answerable.
export_requires_approval = false
interrupt_boundary = "graph_node"
runtime_loop_owner = "custom_runtime"
graph_version = "v1"

[multi_agent]
enabled = true
backend = "custom_supervisor_workers"
topology = "fixed_langgraph"
worker_executor = "custom_runtime"
# Static compiled-graph guard, separate from durable invocation budgets.
static_agent_node_limit = 6
max_parallel_agent_invocations = 3
max_agent_invocation_attempts_per_task = 12
# 120000, not the 16000 that shipped: config.demo-local.toml measured 16000
# running out mid-answer on the web profile and before rendering anything on
# the Word one, every tool call having worked. Same reasoning as
# `runtime.max_steps` above -- a ceiling every working deployment overrides
# upward is mis-sized, and the protection (a hard per-invocation stop) does
# not depend on the number being uncomfortable.
max_tokens_per_agent_invocation = 120000
# ADR-082. Off, and off is the honest default rather than a cautious one: every
# ceiling above describes the compiled graph, whose shape is known when the Task
# is submitted, and a delegated run is the one thing here decided by a model
# mid-loop. Turning it on is a deployment saying it has looked at what its agents
# do with the graph they have.
delegation_enabled = false
# 1 = the run a person asked for may delegate; what it delegates to may not.
max_delegation_depth = 1
# Over the whole life of one run, not at once. The number of delegations in
# flight simultaneously is `runtime.max_parallel_read_tools`, which is a
# different question. Raising either without raising
# `max_agent_invocation_attempts_per_task` fails at startup.
max_children_per_run = 4
# A second pool, not a share of the first. A parent holds its concurrency slot
# for as long as its child runs, so one pool deadlocks the moment the graph's
# own fan-out fills it. The cost is stated rather than hidden: a delegating
# deployment runs up to max_parallel_agent_invocations + this many model loops
# at once.
max_parallel_child_invocations = 2

[rag.llama_index]
# Off until the equivalence evidence ADR-017 step 3 requires actually exists.
# The adapter is built and contract-tested; what is missing is a measurement
# able to tell the two retrieval paths apart. See docs/status.md 2026-08-03.
enabled = false
role = "ingestion_and_retrieval_adapter"
agent_executor_enabled = false
query_engine_generates_final_answer = false
fusion_enabled = false

[rag.ingestion]
chunk_size_tokens = 512
chunk_overlap_tokens = 64
embedding_batch_size = 16
upsert_batch_size = 64
document_versioning_enabled = true
outbox_required = true
parser_version = "v1"
chunker_version = "token-512-64-v1"
index_schema_version = "bge-m3-v1"

[rag.embedding]
model_id = "BAAI/bge-m3"
# Replace "main" with a Hugging Face commit SHA before a production release.
revision = "main"
vector_size = 1024
max_input_tokens = 8192
device = "auto"
precision = "float16"
dense_enabled = true
sparse_enabled = true
# BGE-M3 tokenizer vocabulary. A lexical head of another width is rejected
# before it can populate a collection with plausible but meaningless weights.
sparse_vocabulary_size = 250002
dense_vector_name = "dense"
sparse_vector_name = "sparse"

[rag.retrieval]
# The RRF runs in this process, not in Qdrant's Query API (ADR-033). Still one
# fusion: the adapter issues two single-arm queries and fuses them once, which
# is what makes a tied point's rank follow from its chunk_id and survive a
# re-index. Changing this needs an ADR, not an edit here.
fusion_owner = "application"
fusion_method = "rrf"
# Four of the five below reach retrieval (ADR-097): the arms go to the hybrid
# query, `fused_top_k` is the candidate pool asked of the index, and
# `rerank_top_k` is the most a request may be shown -- a request narrows within
# it and cannot widen past it. The hardcoded `le=50` in `routes/chat.py` and
# `MAX_TOP_K = 20` in `adapters/tools/knowledge_search.py` stay: they bound a
# malformed request at the transport, which is a different job.
#
# `answer_context_k` is the exception and still has no reader (ADR-097 §4.3).
# It is a *default* rather than a ceiling, and the default lives at the request
# boundary; A-07 in docs/known-gaps.md stays open for it alone.
#
# Setting the two arms UNEQUAL makes the reference and LlamaIndex paths
# incomparable (ADR-097 §3.2), because the LlamaIndex store deliberately does
# not shorten either arm. Keep them equal unless an ADR says otherwise.
#
# Changing any of these numbers now changes retrieval, so it wants gold-set
# evidence (known-gaps A-03) rather than an edit here.
dense_top_k = 40
sparse_top_k = 40
fused_top_k = 40
rerank_top_k = 8
answer_context_k = 8
metadata_filter_required = true
acl_filter_required = true
citations_required = true

[rag.reranker]
enabled = true
model_id = "BAAI/bge-reranker-v2-m3"
# Replace "main" with a Hugging Face commit SHA before a production release.
revision = "main"
batch_size = 8
device = "auto"
precision = "float16"
timeout_seconds = 15
failure_mode = "fail_open_with_fused_results"

[rag.graph]
# The entity and relationship arms (ADR-037). Off by default: enabling it
# costs one model call per chunk at ingestion and produces an index that is
# NOT reproducible -- the same corpus extracted twice does not give the same
# graph, which is the opposite of every other index identity here.
enabled = false
# Joins the graph identity: a changed prompt changed what was extracted, and
# rows written under two prompts must not nominate side by side.
prompt_version = "v1"
extraction_profile = "compact"
# Per arm, before the single RRF narrows them.
entity_arm_limit = 12
relation_arm_limit = 12
# Frozen. The graph nominates chunks that retrieval then authorizes by
# document; a graph permitted to answer would put text in front of a reader
# by a path the publish fence never sees.
nominates_chunks_only = true
# Query-side keyword extraction: another model call per query and another
# thing an offline evaluation cannot reproduce. Measured first.
query_side_extraction_enabled = false

[qdrant]
url = "http://qdrant:6333"
read_alias = "knowledge_active"
write_collection = "knowledge_bge_m3_v1"
collection_schema_version = 1
request_timeout_seconds = 10
prefer_grpc = true
distance = "cosine"
derived_index = true
payload_acl_filter_required = true
# Only a local deployment may be false; every remote scope requires true + HTTPS.
api_key_required = false
# Startup never creates or rewires an index by accident. Set true explicitly
# only for a disposable local/test environment to create write_collection and
# bind read_alias to it.
allow_local_bootstrap = false

[artifact_store]
backend = "local"
local_root = "./var/artifacts"
bucket = ""
endpoint = ""
region = ""
max_artifact_bytes = 104857600
presigned_url_ttl_seconds = 300

[policy]
revision = "policy-v1"
default_effect = "deny"
write_tools_require_approval = true
network_tools_require_allowlist = true
shell_tools_enabled = false
path_sandbox_enabled = true
tenant_filter_required = true
max_tool_argument_bytes = 65536
max_tool_result_bytes = 10485760
redact_secrets = true

# External web search for Task research (ADR-020). Off by default, and the
# default is load-bearing: with it off the Task authorization envelope keeps
# refusing `external_search`, so a deployment that never configured it does not
# widen its permission ceiling on upgrade.
#
# No key of its own and no extra dependency: the search runs on the model
# provider's side, through the Anthropic-compatible endpoint DeepSeek exposes
# beside its OpenAI-compatible one, under the same API key. That endpoint is a
# different path on the same service than `model.base_url`, which is why this
# has its own -- only one of the two speaks the Messages protocol.
#
# Caveat worth knowing before enabling: DeepSeek documents the compatible
# endpoint but not a managed web-search tool on it. The capability is reported
# to work rather than specified, so the adapter treats a rejection as "no
# evidence, here is the status" rather than assuming success.
[research]
enabled = false
provider = "deepseek"
base_url = "https://api.deepseek.com/anthropic"
model_id = "deepseek-chat"
max_uses = 5
timeout_seconds = 60

# MCP servers to take tools from (ADR-025). Empty here on purpose: the resolved
# tool names are written into the Task authorization envelope, so a checkout
# that never configured this must not widen anything on upgrade.
#
# Each entry needs `alias`, `endpoint`, an explicit remote-tool allowlist and an
# explicit `retryable_effects`. `optional_labs.mcp_adapter` must be true or
# startup fails rather than quietly ignoring what was written here. Setting
# `retryable_effects=true` means every allowlisted tool is safe to invoke again
# when the whole Task graph node replays; it is stronger than HTTP retryability.
# Example:
#
#   [[mcp.servers]]
#   alias = "office"
#   endpoint = "https://mcp.internal.example/office"
#   tools = ["render_document", "lookup_template"]
#   retryable_effects = true
[mcp]
servers = []

# ADR-029. Off by default: the tool name and the "external" risk ceiling it
# forces are written into each Task's authorization envelope, so a deployment
# that never ran a sandbox must not have its historical Tasks widened by an
# upgrade. The isolation is not configurable and is deliberately absent here.
[sandbox]
enabled = false
endpoint = "http://127.0.0.1:8766/mcp"
timeout_seconds = 180

[observability]
otel_enabled = true
otel_service_name = "agent-workbench"
# 4318, not 4317. The exporter is OTLP over HTTP and posts to
# `<endpoint>/v1/traces`; 4317 is the gRPC port, so the previous default sent
# every span to a listener that could not answer it -- and telemetry fails open,
# so nothing reported the loss. `docker/otel-collector.yaml` receives on this
# same port and a test asserts the two agree.
otel_exporter_endpoint = "http://otel-collector:4318"
trace_sample_ratio = 1.0
record_prompt_body = false
record_tool_result_body = false
metrics_enabled = true
langfuse_enabled = false

[evaluation]
# There is no RAGAS dependency, runner or calibration set in this repository.
# This read `true` while all three were absent, so the configuration answered
# "are answers judged?" with a yes the code could not honour. Setting it back to
# `true` is now a load-time error rather than a no-op -- a flag that silently
# enables nothing is how the claim got made in the first place.
# Whether the console may start a run. Off by default: a run needs the
# `embedding` extra installed and a reachable Qdrant, and neither is implied by
# being able to serve the API. Reading the committed reports is not gated and
# never depends on this.
#
# A full ablation is 30-70 minutes and cannot share a machine with much else,
# which is why `max_concurrent_runs` is a frozen 1 in the settings rather than a
# line here.
runs_enabled = false
run_timeout_seconds = 5400
reports_root = "./evals"
ragas_enabled = false
ragas_offline_only = true
online_judge_in_ci = false
benchmark_isolated_process = true
rag_gold_set_path = "./evals/rag/gold.jsonl"
task_benchmark_path = "./evals/tasks/cases.yaml"
# Exactly the metrics `evaluation.metrics.RETRIEVAL_METRICS` computes, and a
# validator rejects any other name. This list previously carried nineteen
# entries, of which the code implemented two: the answer-level ones
# (faithfulness, citation_*, abstention_*) need a judge that does not exist, and
# the rerank/token/cost ones need instrumentation that does not exist either.
# They are a roadmap, and a roadmap does not belong in the file that says what
# runs. Every metric here answers a question about ranking; k stops at 3 because
# the harness retrieves three.
rag_metrics = [
  "recall_at_1",
  "recall_at_3",
  "full_coverage_at_3",
  "mrr",
