<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 812" width="1240" height="812" class="d" role="img" aria-label="本机拓扑：浏览器与控制台、agent-api、两个 Worker、共享的 PostgreSQL 与 Qdrant 与模型供应商、四个只绑 loopback 的 MCP server">
<style>
.d{--ink:#282825;--soft:#57574f;--faint:#7c7c74;--line:#cfcfc9;--line2:#e5e5e1;--paper:#ffffff;--panel:#f4f4f1;--sunken:#ececE8;--accent:#b75d42;--accent-bg:#f8eee9;--ok:#2f7a54;--ok-bg:#edf5f0;--warn:#8a5c1f;--warn-bg:#faf2e4;--bad:#a94a46;--bad-bg:#fbeceb;--info:#3f6472;--info-bg:#eef3f5}
@media (prefers-color-scheme:dark){.d{--ink:#ecece8;--soft:#b5b5ae;--faint:#8f8f88;--line:#45453f;--line2:#33332f;--paper:#1c1c1b;--panel:#232321;--sunken:#2a2a27;--accent:#d98265;--accent-bg:#2c1b14;--ok:#6cba8b;--ok-bg:#12291b;--warn:#d6a45c;--warn-bg:#2d210d;--bad:#e58e88;--bad-bg:#361b19;--info:#8fb7c6;--info-bg:#16262d}}
:root[data-theme="dark"] .d{--ink:#ecece8;--soft:#b5b5ae;--faint:#8f8f88;--line:#45453f;--line2:#33332f;--paper:#1c1c1b;--panel:#232321;--sunken:#2a2a27;--accent:#d98265;--accent-bg:#2c1b14;--ok:#6cba8b;--ok-bg:#12291b;--warn:#d6a45c;--warn-bg:#2d210d;--bad:#e58e88;--bad-bg:#361b19;--info:#8fb7c6;--info-bg:#16262d}
:root[data-theme="light"] .d{--ink:#282825;--soft:#57574f;--faint:#7c7c74;--line:#cfcfc9;--line2:#e5e5e1;--paper:#ffffff;--panel:#f4f4f1;--sunken:#ececE8;--accent:#b75d42;--accent-bg:#f8eee9;--ok:#2f7a54;--ok-bg:#edf5f0;--warn:#8a5c1f;--warn-bg:#faf2e4;--bad:#a94a46;--bad-bg:#fbeceb;--info:#3f6472;--info-bg:#eef3f5}
.d text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:var(--ink)}
.d .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.d .h{font-size:14.5px;font-weight:600}
.d .t{font-size:12.5px}
.d .s{font-size:11.5px;fill:var(--soft)}
.d .f{font-size:10.5px;fill:var(--faint)}
.d .paper{fill:var(--paper);stroke:var(--line)}
.d .panel{fill:var(--panel);stroke:var(--line2)}
.d .sunk{fill:var(--sunken);stroke:var(--line2)}
.d .acc{fill:var(--accent-bg);stroke:var(--accent)}
.d .ok{fill:var(--ok-bg);stroke:var(--ok)}
.d .warn{fill:var(--warn-bg);stroke:var(--warn)}
.d .bad{fill:var(--bad-bg);stroke:var(--bad)}
.d .info{fill:var(--info-bg);stroke:var(--info)}
.d .edge{stroke:var(--line);stroke-width:1.4;fill:none}
.d .edge-a{stroke:var(--accent);stroke-width:1.8;fill:none}
.d .dash{stroke-dasharray:4 4}
.d .ai{fill:var(--accent)}
.d .oi{fill:var(--ok)}
.d .wi{fill:var(--warn)}
.d .bi{fill:var(--bad)}
.d .ii{fill:var(--info)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
</defs>
<rect width="1240" height="812" fill="none"/>
<text x="24" y="36" class="h" text-anchor="start">本机拓扑：谁是一个进程，谁绑在哪个口上</text>
<text x="24" y="58" class="s" text-anchor="start">全部只绑 127.0.0.1。当前 Identity Adapter 只信任请求头，所以这套东西只能用于受控的本机开发（ADR-044）。</text>
<rect x="24" y="92" width="380" height="78" rx="10" class="paper"/><text x="40" y="118" class="t m" text-anchor="start">浏览器 · web 控制台</text><text x="388" y="118" class="f m" text-anchor="end">Vite</text><text x="40" y="140" class="f" text-anchor="start">八个页面。唯一出网的地方是 web/src/api 下的两个文件；</text><text x="40" y="156" class="f" text-anchor="start">别处出现 fetch( 就是这条边界破了。</text>
<path d="M214 170 L214 208" class="edge" marker-end="url(#a)"/>
<text x="228" y="194" class="f" text-anchor="start">HTTP + SSE —— 断线可按游标续读</text>
<rect x="24" y="208" width="380" height="132" rx="10" class="acc"/><text x="40" y="234" class="t m" text-anchor="start">agent-api</text><text x="388" y="234" class="f m" text-anchor="end">:8000</text><text x="40" y="256" class="f" text-anchor="start">HTTP 控制平面，71 个端点，事件走 SSE</text><text x="40" y="272" class="f" text-anchor="start">没有 key 时省略 Chat 并说明，而不是假装有</text><text x="40" y="288" class="f" text-anchor="start">--without-chat 连 embedding 运行时一起跳过</text>
<path d="M214 340 L214 382" class="edge" marker-end="url(#a)"/>
<rect x="430" y="208" width="380" height="132" rx="10" class="acc"/><text x="446" y="234" class="t m" text-anchor="start">agent-task-worker</text><text x="446" y="256" class="f" text-anchor="start">FOR UPDATE SKIP LOCKED 认领 + 租约心跳</text><text x="446" y="272" class="f" text-anchor="start">按提交时冻结的版本编译并执行 LangGraph 图</text><text x="446" y="288" class="f" text-anchor="start">没有 key 时跑 --demo 图，并且说自己在跑 demo</text>
<path d="M620 340 L620 382" class="edge" marker-end="url(#a)"/>
<rect x="836" y="208" width="380" height="132" rx="10" class="paper"/><text x="852" y="234" class="t m" text-anchor="start">agent-ingestion-worker</text><text x="852" y="256" class="f" text-anchor="start">解析 → 切块 → 向量化 → 写 Qdrant</text><text x="852" y="272" class="f" text-anchor="start">同时负责 bootstrap 集合与别名</text><text x="852" y="288" class="f" text-anchor="start">不跑它，上传永远停在 processing 且界面分不出来</text>
<path d="M1026 340 L1026 382" class="edge" marker-end="url(#a)"/>
<rect x="24" y="382" width="1192" height="166" rx="10" class="panel"/><text x="42" y="408" class="h m" text-anchor="start">共享服务</text><text x="42" y="427" class="s" text-anchor="start">三个进程各自连它们，没有一个进程替另一个转发</text>
<rect x="44" y="440" width="372" height="90" rx="10" class="info"/><text x="60" y="466" class="t m" text-anchor="start">PostgreSQL</text><text x="400" y="466" class="f m" text-anchor="end">:5433</text><text x="60" y="488" class="f" text-anchor="start">唯一事实源：会话、任务、事件、检查点、outbox。</text><text x="60" y="504" class="f" text-anchor="start">端口是 5433 不是 5432——本机自带的 PostgreSQL 会遮住容器。</text>
<rect x="436" y="440" width="372" height="90" rx="10" class="info"/><text x="452" y="466" class="t m" text-anchor="start">Qdrant</text><text x="792" y="466" class="f m" text-anchor="end">:6333</text><text x="452" y="488" class="f" text-anchor="start">派生副本，不是事实源。dense 与 sparse 两路存储，</text><text x="452" y="504" class="f" text-anchor="start">融合在应用进程里跑一次，不外包给向量库。</text>
<rect x="828" y="440" width="372" height="90" rx="10" class="warn"/><text x="844" y="466" class="t m" text-anchor="start">模型供应商</text><text x="1184" y="466" class="f m" text-anchor="end">外网</text><text x="844" y="488" class="f" text-anchor="start">DeepSeek，OpenAI 兼容，流式。服务端的 web_search</text><text x="844" y="504" class="f" text-anchor="start">不引入第二把 key。</text>
<rect x="24" y="568" width="1192" height="168" rx="10" class="panel"/><text x="42" y="594" class="h m" text-anchor="start">四个自有 MCP server</text><text x="42" y="613" class="s" text-anchor="start">由 agent-api 与 agent-task-worker 在启动时各自连接。工具目录在进程启动时冻结一次——Worker 起来之后再启动的 server，那个 Worker 这辈子都看不到它。</text>
<rect x="44" y="618" width="568" height="52" rx="8" class="paper"/>
<text x="60" y="640" class="f m" text-anchor="start">agent-word-mcp</text>
<text x="596" y="640" class="f m" text-anchor="end">:8765</text>
<text x="60" y="657" class="f" text-anchor="start">render_document —— 把结构化内容渲染成 .docx</text>
<rect x="632" y="618" width="568" height="52" rx="8" class="paper"/>
<text x="648" y="640" class="f m" text-anchor="start">agent-sandbox-mcp</text>
<text x="1184" y="640" class="f m" text-anchor="end">:8766</text>
<text x="648" y="657" class="f" text-anchor="start">run_python —— 一次调用一个容器，无网络、只读根、非 root</text>
<rect x="44" y="678" width="568" height="52" rx="8" class="paper"/>
<text x="60" y="700" class="f m" text-anchor="start">agent-web-mcp</text>
<text x="596" y="700" class="f m" text-anchor="end">:8767</text>
<text x="60" y="717" class="f" text-anchor="start">fetch_page / download_document —— 都是 GET，取用前过地址闸</text>
<rect x="632" y="678" width="568" height="52" rx="8" class="paper"/>
<text x="648" y="700" class="f m" text-anchor="start">agent-computer-mcp</text>
<text x="1184" y="700" class="f m" text-anchor="end">:8768</text>
<text x="648" y="717" class="f" text-anchor="start">screenshot / left_click / type / key / scroll …（仅 macOS）</text>
<text x="24" y="768" class="s" text-anchor="start">另外两个不长期跑的进程：agent-cli demo（零依赖演示，不要数据库、不联网、不要 key，输出逐字节可复现）与 agent-config-check --profile（离线跑三套 profile）。</text>
<text x="24" y="790" class="f" text-anchor="start">scripts/dev.sh 是这台机器唯一知道本机环境的地方；供应商 key 从 AW_SECRETS__DEEPSEEK_API_KEY 读，回落到 checkout 之外的 AW_KEY_FILE——zip -r 与 Finder 的「压缩」都不认 .gitignore。</text>
</svg>
