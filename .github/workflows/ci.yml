name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React console lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.14.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install locked frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run frontend quality gates
        run: pnpm --dir web check

      - name: Install Chromium for browser smoke tests
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Run browser shell smoke tests
        run: pnpm --dir web test:e2e

  quality:
    name: Config, architecture, lint, type and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --frozen --group dev --no-editable

      - name: Keep quality checks offline
        run: echo "UV_OFFLINE=1" >> "$GITHUB_ENV"

      - name: Verify lock file
        run: uv lock --check --offline

      - name: Check formatting and lint
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .

      - name: Type-check framework-neutral source
        run: uv run --no-sync pyright

      - name: Validate development and test profiles
        env:
          AW_DATABASE__DSN: postgresql+asyncpg://agent:ci-only@postgres:5432/agent_workbench
          AW_DATABASE__GUARD_DSN: postgresql+asyncpg://agent:ci-only@postgres:5432/agent_workbench
          AW_DATABASE__LISTEN_DSN: postgresql+asyncpg://agent:ci-only@postgres:5432/agent_workbench
        run: |
          uv run --no-sync agent-config-check --profile development
          uv run --no-sync agent-config-check --profile test

      - name: Validate production configuration contract
        env:
          AW_DATABASE__DSN: postgresql+asyncpg://agent:ci-only@postgres:5432/agent_workbench
          AW_DATABASE__GUARD_DSN: postgresql+asyncpg://agent:ci-only@postgres:5432/agent_workbench
          AW_DATABASE__LISTEN_DSN: postgresql+asyncpg://agent:ci-only@postgres:5432/agent_workbench
          AW_MODEL__MAIN__MODEL_ID: ci-contract-main-model
          AW_MODEL__COMPACT__MODEL_ID: ci-contract-compact-model
          AW_RAG__EMBEDDING__REVISION: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AW_RAG__RERANKER__REVISION: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          AW_SECRETS__DEEPSEEK_API_KEY: ci-contract-deepseek-key
          AW_SECRETS__QDRANT_API_KEY: ci-contract-qdrant-key
        run: uv run --no-sync agent-config-check --profile production

      - name: Run deterministic tests
        run: uv run --no-sync pytest -q

      - name: Smoke the installed CLI entry point
        run: |
          uv run --no-sync agent-cli demo --format json > cli-demo.jsonl
          diff -u tests/cli/golden/demo_tool_round.jsonl cli-demo.jsonl

      # Permissive and file-level-copyleft licences are allowed; strong
      # copyleft (GPL, AGPL, LGPL) and unstated licences are not, which is what
      # this gate exists to catch. Matching is exact string comparison against
      # whatever the package metadata states, so every spelling has to be
      # listed on its own -- including compound expressions such as
      # "MIT AND PSF-2.0", whose parts are both already allowed.
      # FlagEmbedding is named rather than its "UNKNOWN" being allowed. It
      # ships an MIT LICENSE inside the wheel and simply declares no License
      # classifier in its metadata, which is what pip-licenses reports on.
      # Allowing "UNKNOWN" would pass every future package that states nothing,
      # which is precisely what this gate exists to catch; naming one package
      # costs a line and a reason somebody had to write down.
      #
      # llama-index-core (ADR-017) brought roughly fifty transitive packages,
      # of which exactly five did not match an existing spelling. Four are new
      # spellings of licences this policy already accepts and are listed:
      # "ISC" is what griffe, griffecli and griffelib state, against the
      # "ISC License (ISCL)" classifier spelling already here; "MIT-CMU" is
      # what Pillow states, the SPDX identifier for the permissive HPND-style
      # licence it has always shipped under. Neither adds a licence class --
      # both are already-allowed classes under a different name, which is the
      # case this allowlist was built to enumerate.
      #
      # tiktoken is named rather than spelled. Its metadata License field is
      # not an identifier at all: it is the entire MIT licence text, newlines
      # and copyright line included, and pip-licenses compares that whole
      # string. There is no spelling to add short of pasting the licence into
      # this file, and doing that would make the allowlist match one exact
      # rendering of MIT rather than a class of licences. Same reasoning as
      # FlagEmbedding: the package is permissive, it declares so badly, and
      # naming it keeps the failure of every *other* badly-declaring package
      # intact.
      # cffi 2.1.1 and cryptography enter through the official MCP SDK. cffi
      # declares MIT-0; cryptography declares Apache-2.0 OR BSD-3-Clause. All
      # components are already permitted policy classes, but the gate compares
      # exact metadata strings, so both new spellings are listed explicitly.
      - name: Enforce dependency license policy
        run: >-
          uv run --no-sync pip-licenses
          --from mixed
          --ignore-packages agent-workbench FlagEmbedding tiktoken
          --allow-only
          "MIT;MIT-0;MIT License;MIT AND PSF-2.0;BSD License;BSD-2-Clause;BSD-3-Clause;Apache-2.0;Apache Software License;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;3-Clause BSD License;Apache 2.0 License;Apache License 2.0;Apache Software License; BSD License;Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND BSL-1.0 AND MIT;Apache-2.0 AND CNRI-Python;Apache-2.0 AND MIT;ISC;ISC License (ISCL);MIT-CMU;MPL-2.0 AND MIT;Python Software Foundation License;MPL-2.0 AND (Apache-2.0 OR MIT);Apache-2.0 OR MIT"

      # The embedding extra is deliberately absent here: the runtime and the
      # weights are several gigabytes, and every gate above runs without them.
      # Asserted rather than assumed -- if it ever gets installed by accident,
      # the offline-CI property would be lost silently, and the skip count
      # below would quietly drop to zero.
      - name: Confirm the optional embedding runtime is not installed
        run: >-
          uv run --no-sync python -c
          "import importlib.util, sys;
          sys.exit(0 if importlib.util.find_spec('sentence_transformers') is None
          else 'the embedding extra must not be installed in CI')"

  stateful:
    name: Migrations, PostgreSQL and Qdrant-backed stores
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agent_workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_workbench_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # Pinned by digest like every other image here: a tag can be moved, and
      # an index built against a different server is not the one tested.
      qdrant:
        image: qdrant/qdrant@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
        ports:
          - 6333:6333

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --frozen --group dev --no-editable

      - name: Apply migrations
        env:
          AW_DATABASE__DSN: postgresql+asyncpg://agent:ci-only@localhost:5432/agent_workbench_test
        run: uv run --no-sync alembic upgrade head

      - name: Wait for Qdrant
        run: |
          # The image ships no shell, so a container health check is not an
          # option; the readiness endpoint is polled from the runner instead.
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:6333/readyz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Run the service-backed suites
        env:
          AGENT_WORKBENCH_TEST_DSN: postgresql+asyncpg://agent:ci-only@localhost:5432/agent_workbench_test
          AGENT_WORKBENCH_TEST_QDRANT_URL: http://localhost:6333
        run: >-
          uv run --no-sync pytest -q
          tests/contracts tests/persistence tests/api tests/vector

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks CLI
        env:
          GITLEAKS_ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --location --silent --show-error \
            --output "${GITLEAKS_ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${GITLEAKS_ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${GITLEAKS_ARCHIVE}" | sha256sum --check
          tar --extract --gzip --file "${GITLEAKS_ARCHIVE}" gitleaks

      - name: Scan Git history for secrets
        run: ./gitleaks git --redact --no-banner --verbose .
