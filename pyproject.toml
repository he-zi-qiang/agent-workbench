[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-workbench"
version = "0.1.0"
description = "A framework-neutral Agent runtime with Chat/RAG and Task workflows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "He Ziqiang" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<0.31",
  "fastapi>=0.115,<1",
  "httpx>=0.28.1",
  # A main dependency rather than an extra. The embedding extra exists because
  # its runtime and weights are gigabytes; langgraph is small and pure Python,
  # so putting it behind an extra would buy nothing except a CI that skips the
  # workflow adapter's tests and therefore proves nothing about it.
  "langgraph>=0.6,<0.7",
  # LangChain's tool contract, and only that. It arrives transitively through
  # langgraph already; declaring it is the difference between "we use this" and
  # "a resolver happens to give us this", and the interop adapter uses it
  # directly. Nothing imports langchain proper.
  "langchain-core>=0.3,<2",
  # The RAG framework ADR-017 names, and only its core. There is no lighter
  # distribution: llama-index-core is where Document, Node, BaseEmbedding,
  # BasePydanticVectorStore and BaseRetriever live, and those are the contracts
  # the adapter implements. The integration packages are deliberately absent --
  # llama-index-vector-stores-qdrant would bring a second opinion about how
  # points are laid out in a collection this project's own ingestion writes,
  # and about where fusion happens, which ADR-017 assigns to Qdrant alone.
  #
  # A main dependency rather than an extra, on the same reasoning as langgraph:
  # behind an extra, CI would skip the adapter's tests and prove nothing about
  # it. The cost is honest and worth stating -- it pulls roughly fifty
  # transitive packages (nltk, tiktoken, pillow, networkx among them) into
  # every process that installs the project, including ones that never
  # retrieve anything.
  "llama-index-core>=0.14.23,<0.15",
  # MCP is an outer tool adapter only: protocol objects are translated into
  # ToolSpec/ToolResult inside adapters/mcp and never enter the core runtime.
  # v2 is the current stable SDK line and its Client accepts both an HTTP URL
  # and an in-memory server, which keeps transport E2E and adapter contracts on
  # the same implementation. The CLI extra is intentionally not installed.
  "mcp>=2.0,<3",
  "pydantic>=2.12,<3",
  # A main dependency rather than an extra, on the same reasoning as langgraph:
  # it is small, pure Python and BSD-3, so hiding it behind an extra would buy
  # nothing except a CI that skips the parser's tests and therefore proves
  # nothing about it. PyMuPDF is faster and AGPL, which the licence gate
  # rejects and which this project has no business shipping.
  # Observability, as an API plus one exporter. The core never imports these --
  # the architecture guard forbids it -- so they reach the process through an
  # adapter behind ``ports.telemetry``. Apache-2.0, which the licence gate
  # already allows.
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "pypdf>=5,<7",
  "pydantic-settings>=2.14.2,<3",
  # For `workspace_grep`, and specifically for its `timeout=` argument, which
  # stdlib `re` has no equivalent of. The pattern is written by the model, so
  # it is untrusted input: a catastrophically backtracking expression must be
  # interruptible rather than merely noticed afterwards, and `re` cannot be
  # interrupted at all. Measured on this engine: `(a|a)*$` against 200
  # characters raises after the deadline instead of running for hours.
  #
  # It already arrives transitively (nltk, via llama-index). Declaring it is
  # the difference between "we use this" and "a resolver happens to give us
  # this" -- the same reason langchain-core is spelled out above.
  "regex>=2024.11,<2027",
  # The project-owned Word MCP server renders in memory. It never accepts a
  # filesystem path and returns the OOXML package as one embedded MCP resource.
  "python-docx>=1.2,<2",
  "python-dotenv>=1,<2",
  # Matched to the server image pinned by digest in CI. Qdrant checks major
  # and minor on connect, and a mismatch it only warns about today is a
  # wire incompatibility it can enforce tomorrow.
  "qdrant-client>=1.12,<1.13",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
# The real embedder. Kept optional because the runtime and the weights together
# are several gigabytes, and every gate except the embedding contract itself
# runs without them. CI does not install this; see docs/status.md for what that
# means for the capability table.
embedding = [
  "sentence-transformers>=3.3,<6",
  # BGE's own library, and the only way to get BGE-M3's sparse lexical weights.
  # sentence-transformers' SparseEncoder attaches a SparseAutoEncoder to models
  # that declare no sparse head: for BGE-M3 that produces a 4096-dimensional
  # re-encoding of the dense vector, not the 250002-dimensional term weights
  # the model actually has. See ADR-013.
  "FlagEmbedding>=1.3,<2",
]

[project.scripts]
agent-api = "agent_workbench.apps.api.main:main"
agent-cli = "agent_workbench.apps.cli.main:main"
agent-ingestion-worker = "agent_workbench.apps.ingestion_worker.main:main"
agent-task-worker = "agent_workbench.apps.task_worker.main:main"
agent-word-mcp = "agent_workbench.apps.word_mcp.main:main"
agent-sandbox-mcp = "agent_workbench.apps.sandbox_mcp.main:main"
agent-web-mcp = "agent_workbench.apps.web_mcp.main:main"
agent-config-check = "agent_workbench.bootstrap.config_check:main"
agent-evidence = "agent_workbench.bootstrap.evidence:main"

[dependency-groups]
dev = [
  "pip-licenses>=5,<6",
  "pyright[nodejs]>=1.1.400,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workbench"]

[tool.hatch.build.targets.wheel.force-include]
"config/config.default.toml" = "agent_workbench/_config/config.default.toml"
"config/config.test.toml" = "agent_workbench/_config/config.test.toml"
"config/config.production.toml" = "agent_workbench/_config/config.production.toml"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
# "." so shared test helpers are importable as `tests.support.*`. Without it a
# helper can only be reached from a module pytest has already collected, which
# is true locally and false in a fresh process -- CI found the difference.
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The terminal session is the one Python surface that speaks to a reader, and
# it speaks the language the web console does -- including the stage names, so
# that someone who has seen one recognises the other. RUF001 is here to catch a
# Cyrillic `о` hiding in an identifier, not a full-width comma in a sentence
# deliberately written in Chinese. Scoped to these two files so the rule keeps
# doing its real job everywhere else.
"src/agent_workbench/apps/cli/repl.py" = ["RUF001"]
"src/agent_workbench/apps/cli/stages.py" = ["RUF001"]
"src/agent_workbench/apps/cli/commands.py" = ["RUF001"]
# Triage speaks to the submitter in the submitter's language (ADR-036): its
# fallback question is a Chinese sentence, and the tests assert those exact
# sentences round-trip.
"src/agent_workbench/application/task_triage.py" = ["RUF001"]
"tests/application/test_task_triage.py" = ["RUF001"]
"tests/api/test_task_api.py" = ["RUF001"]
"tests/cli/test_repl.py" = ["RUF001"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__"]
venvPath = "."
venv = ".venv"
