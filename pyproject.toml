[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-workbench"
version = "0.1.0"
description = "A framework-neutral Agent runtime with Chat/RAG and Task workflows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "He Ziqiang" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<0.31",
  "fastapi>=0.115,<1",
  "httpx>=0.28.1",
  # A main dependency rather than an extra. The embedding extra exists because
  # its runtime and weights are gigabytes; langgraph is small and pure Python,
  # so putting it behind an extra would buy nothing except a CI that skips the
  # workflow adapter's tests and therefore proves nothing about it.
  "langgraph>=0.6,<0.7",
  # LangChain's tool contract, and only that. It arrives transitively through
  # langgraph already; declaring it is the difference between "we use this" and
  # "a resolver happens to give us this", and the interop adapter uses it
  # directly. Nothing imports langchain proper.
  "langchain-core>=0.3,<2",
  # The RAG framework ADR-017 names, and only its core. There is no lighter
  # distribution: llama-index-core is where Document, Node, BaseEmbedding,
  # BasePydanticVectorStore and BaseRetriever live, and those are the contracts
  # the adapter implements. The integration packages are deliberately absent --
  # llama-index-vector-stores-qdrant would bring a second opinion about how
  # points are laid out in a collection this project's own ingestion writes,
  # and about where fusion happens, which ADR-017 assigns to Qdrant alone.
  #
  # A main dependency rather than an extra, on the same reasoning as langgraph:
  # behind an extra, CI would skip the adapter's tests and prove nothing about
  # it. The cost is honest and worth stating -- it pulls roughly fifty
  # transitive packages (nltk, tiktoken, pillow, networkx among them) into
  # every process that installs the project, including ones that never
  # retrieve anything.
  "llama-index-core>=0.14.23,<0.15",
  # MCP is an outer tool adapter only: protocol objects are translated into
  # ToolSpec/ToolResult inside adapters/mcp and never enter the core runtime.
  # v2 is the current stable SDK line and its Client accepts both an HTTP URL
  # and an in-memory server, which keeps transport E2E and adapter contracts on
  # the same implementation. The CLI extra is intentionally not installed.
  "mcp>=2.0,<3",
  "pydantic>=2.12,<3",
  # A main dependency rather than an extra, on the same reasoning as langgraph:
  # it is small, pure Python and BSD-3, so hiding it behind an extra would buy
  # nothing except a CI that skips the parser's tests and therefore proves
  # nothing about it. PyMuPDF is faster and AGPL, which the licence gate
  # rejects and which this project has no business shipping.
  # Observability, as an API plus one exporter. The core never imports these --
  # the architecture guard forbids it -- so they reach the process through an
  # adapter behind ``ports.telemetry``. Apache-2.0, which the licence gate
  # already allows.
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "pypdf>=5,<7",
  "pydantic-settings>=2.14.2,<3",
  # For `workspace_grep`, and specifically for its `timeout=` argument, which
  # stdlib `re` has no equivalent of. The pattern is written by the model, so
  # it is untrusted input: a catastrophically backtracking expression must be
  # interruptible rather than merely noticed afterwards, and `re` cannot be
  # interrupted at all. Measured on this engine: `(a|a)*$` against 200
  # characters raises after the deadline instead of running for hours.
  #
  # It already arrives transitively (nltk, via llama-index). Declaring it is
  # the difference between "we use this" and "a resolver happens to give us
  # this" -- the same reason langchain-core is spelled out above.
  "regex>=2024.11,<2027",
  # The project-owned Word MCP server renders in memory. It never accepts a
  # filesystem path and returns the OOXML package as one embedded MCP resource.
  "python-docx>=1.2,<2",
  "python-dotenv>=1,<2",
  # Matched to the server image pinned by digest in CI. Qdrant checks major
  # and minor on connect, and a mismatch it only warns about today is a
  # wire incompatibility it can enforce tomorrow.
  "qdrant-client>=1.12,<1.13",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
# The real embedder. Kept optional because the runtime and the weights together
# are several gigabytes, and every gate except the embedding contract itself
# runs without them. CI does not install this; see docs/status.md for what that
# means for the capability table.
embedding = [
  "sentence-transformers>=3.3,<6",
  # BGE's own library, and the only way to get BGE-M3's sparse lexical weights.
  # sentence-transformers' SparseEncoder attaches a SparseAutoEncoder to models
  # that declare no sparse head: for BGE-M3 that produces a 4096-dimensional
  # re-encoding of the dense vector, not the 250002-dimensional term weights
  # the model actually has. See ADR-013.
  "FlagEmbedding>=1.3,<2",
]

# Computer use: the adapter that actually touches a screen. macOS only, and
# optional for that reason -- `pyobjc-framework-Quartz` does not install on
# Linux, where CI runs, and the layer above it (tier gate, screenshot budget,
# focus check) is platform-independent and covered without it. A deployment
# that wants the screen tools installs this and gets `agent-computer-mcp`;
# without it the adapter raises at startup rather than silently doing nothing.
computer-use = [
  "pyobjc-framework-Quartz>=10,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
  # ScreenCaptureKit, and it is the difference between "the model did not see
  # that window" and "the model saw it and we painted over it". Known-gap F-18
  # recorded that pyobjc's coverage of this framework was incomplete, which is
  # why the first implementation masked instead of filtering; that was true
  # when it was written and is not now -- the official binding publishes at the
  # same version as the two pins above and needs no hand-written Objective-C
  # metadata (ADR-076).
  "pyobjc-framework-ScreenCaptureKit>=10,<13; sys_platform == 'darwin'",
]

[project.scripts]
agent-api = "agent_workbench.apps.api.main:main"
agent-cli = "agent_workbench.apps.cli.main:main"
agent-ingestion-worker = "agent_workbench.apps.ingestion_worker.main:main"
agent-task-worker = "agent_workbench.apps.task_worker.main:main"
agent-word-mcp = "agent_workbench.apps.word_mcp.main:main"
agent-sandbox-mcp = "agent_workbench.apps.sandbox_mcp.main:main"
agent-web-mcp = "agent_workbench.apps.web_mcp.main:main"
agent-computer-mcp = "agent_workbench.apps.computer_mcp.main:main"
agent-config-check = "agent_workbench.bootstrap.config_check:main"
agent-evidence = "agent_workbench.bootstrap.evidence:main"

[dependency-groups]
dev = [
  "pip-licenses>=5,<6",
  "pyright[nodejs]>=1.1.400,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workbench"]

[tool.hatch.build.targets.wheel.force-include]
"config/config.default.toml" = "agent_workbench/_config/config.default.toml"
"config/config.test.toml" = "agent_workbench/_config/config.test.toml"
"config/config.production.toml" = "agent_workbench/_config/config.production.toml"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
# "." so shared test helpers are importable as `tests.support.*`. Without it a
# helper can only be reached from a module pytest has already collected, which
# is true locally and false in a fresh process -- CI found the difference.
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The terminal session is the one Python surface that speaks to a reader, and
# it speaks the language the web console does -- including the stage names, so
# that someone who has seen one recognises the other. RUF001 is here to catch a
# Cyrillic `о` hiding in an identifier, not a full-width comma in a sentence
# deliberately written in Chinese. Scoped to these two files so the rule keeps
# doing its real job everywhere else.
"src/agent_workbench/apps/cli/repl.py" = ["RUF001"]
"src/agent_workbench/apps/cli/stages.py" = ["RUF001"]
"src/agent_workbench/apps/cli/commands.py" = ["RUF001"]
# Triage speaks to the submitter in the submitter's language (ADR-036): its
# fallback question is a Chinese sentence, and the tests assert those exact
# sentences round-trip.
"src/agent_workbench/application/task_triage.py" = ["RUF001"]
# Both of these put a sentence in front of a reader: the refusal that tells a
# deployment which command to run instead, and the line a killed run leaves in
# its own output tail. Same reason as above -- the rule is here to catch a
# Cyrillic lookalike in an identifier, not deliberate Chinese prose.
"src/agent_workbench/application/evaluation.py" = ["RUF001"]
"src/agent_workbench/adapters/evaluation/subprocess_launcher.py" = ["RUF001"]
# RUF003 rather than RUF001: the Chinese here is inside a *comment*, and it is
# a verbatim quote of what a model actually reported before the sandbox prompt
# existed. Paraphrasing it into ASCII punctuation would make the record of a
# measurement no longer the thing that was measured.
"src/agent_workbench/application/code_prompt.py" = ["RUF003"]
# 这两处的中文都在**注释和 docstring 里**，讲的是同一件事的两半：一条助手消息的
# 花销为什么可能是 `None`，以及为什么那三种「问不出答案」必须和「真的花了 0」在
# 屏幕上长得不一样。这段推理是给下一个改这里的人看的，而它要区分的恰恰是几个中
# 文的「零」「无」「没有」——把标点换成 ASCII 不会让它更清楚，只会让它更别扭。
# RUF002/RUF003 而不是 RUF001：没有一个标识符受影响，全部落在散文里。
"src/agent_workbench/ports/conversation_store.py" = ["RUF002", "RUF003"]
"src/agent_workbench/adapters/persistence/conversation_store.py" = ["RUF002", "RUF003"]
# 同一批改动的另外两处，同一个理由：注释里的中文解释的是「为什么这里是 `None`
# 而不是零」，而那句话要区分的正是几个中文词之间的差别。
"src/agent_workbench/adapters/memory/conversation_store.py" = ["RUF003"]
"src/agent_workbench/apps/api/routes/chat.py" = ["RUF002", "RUF003"]
# The approval dialog is the one string in this repository a person reads
# *before* deciding whether to hand a program their screen. It is Chinese
# because the person at this machine is, and its punctuation is full-width for
# the same reason. Rewording it into ASCII commas to satisfy a rule that exists
# to catch a Cyrillic lookalike in an identifier would make the sentence worse
# at the only job it has.
"src/agent_workbench/apps/computer_mcp/consent.py" = ["RUF001"]
# The two refusals this router writes are sentences a person reads: "say which
# project, or null to take it out". Same reason as the entries above -- the rule
# is here to catch a Cyrillic lookalike in an identifier, not a full-width comma
# in deliberate Chinese.
"src/agent_workbench/apps/api/routes/projects.py" = ["RUF001"]
# 这一页的全部内容就是给人读的句子：每一行「缺什么、为什么缺、怎么补」。这些理由
# 与产生它们的那个判断写在同一处，是这条路由存在的理由——把它们搬去浏览器端的
# 映射表，就又多了一份会和代码走散的说法。RUF001 在这里要抓的仍是标识符里混进来
# 的西里尔字母，不是一段刻意用中文写的诊断。
"src/agent_workbench/apps/api/routes/system.py" = ["RUF001"]
"tests/api/test_system_capabilities.py" = ["RUF001"]
"tests/application/test_task_triage.py" = ["RUF001"]
"tests/api/test_task_api.py" = ["RUF001"]
"tests/cli/test_repl.py" = ["RUF001"]
# The docx fixtures are verbatim OOXML: content-type overrides and relationship
# types are single URIs well past the line limit, and they have to be exact --
# the point of that file is that python-docx opens a package this project did
# not write, so a reformatted namespace would be testing a different file.
"tests/ingestion/test_docx_parsing.py" = ["E501"]
# RUF002, and the same reasoning as `code_prompt.py` above one rule along: the
# Chinese here is a *docstring* quoting, verbatim, what a model actually wrote
# before this tool description told it not to -- `好的，我按 coordinator 的角色
# 执行` and the `# Analyst A 返回：` heading it invented. That quote is the
# evidence for why the sentence beneath it exists. Normalising its punctuation
# to ASCII would leave a record of a measurement that is no longer the thing
# that was measured.
"src/agent_workbench/adapters/tools/delegate.py" = ["RUF002"]
"tests/adapters/test_delegate_tool.py" = ["RUF002"]
# 同一条理由，第三处：这条测试的 docstring 里引的是一个 Task 在报告末尾写下的原话
# （「多 Agent 是模拟的……」），它是这个 profile 为什么必须打开委派的全部证据。把它的
# 标点规整成 ASCII，留下的就是一份不再是被引之物的引用。
"tests/config/test_local_console_profile.py" = ["RUF002"]
# `KNOWN_UNREAD_LEAVES` 的每个值都是一句要被人读的理由——它写明这个配置叶子为什么
# 至今没有读者，是哪一条缺口在跟，还是「没有读者才是对的」。这张表的用处全在这些
# 句子上，把它们规整成 ASCII 标点只会让它们更难读。RUF001 在这里要抓的是标识符里
# 混进来的西里尔字母，不是一份刻意用中文写的豁免说明。
"tests/architecture/test_config_leaves_have_readers.py" = ["RUF001", "RUF003"]
# 架构面板是一个用中文写给读者看的页面，外加一整份内联进来的 HTML/CSS/JavaScript。
# 两条豁免各有各的理由，都不是「这文件太吵所以关掉」：
#   RUF001/2/3 —— 面板上每一句解释都是中文散文，标点当然是全角的。这条规则要抓的是
#   标识符里混进来的西里尔字母，而这里没有一个标识符受影响。
#   E501 —— PAGE 那个字符串里是另外两门语言。一条 CSS 规则或一行 JSX 模板在 88 列
#   处折行，读起来不会更清楚，改起来反而更容易折错；这与 test_docx_parsing.py 里
#   逐字节的 OOXML 是同一类豁免。上面那一半（真正的 Python）仍然由 ruff format
#   管着，它换行的地方和别处一样。
"scripts/architecture_panel.py" = ["E501", "RUF001", "RUF002", "RUF003"]
# 这三条拒绝理由会原样出现在设置面板里——「这把 key 是空的」「拒绝把 key 写进
# checkout 里」「删不掉这个文件」。它们是给人读的句子，标点当然是全角的；RUF001
# 在这里要抓的是标识符里混进来的西里尔字母，而这个文件里没有一个标识符受影响。
"src/agent_workbench/application/provider_key.py" = ["RUF001"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__"]
venvPath = "."
venv = ".venv"
