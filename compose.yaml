name: agent-workbench

x-app-environment: &app-environment
  AW_DATABASE__DSN: postgresql+asyncpg://agent@postgres:5432/agent_workbench
  AW_DATABASE__GUARD_DSN: postgresql+asyncpg://agent@postgres:5432/agent_workbench
  AW_DATABASE__LISTEN_DSN: postgresql+asyncpg://agent@postgres:5432/agent_workbench
  AW_ARTIFACT_STORE__LOCAL_ROOT: /var/lib/agent-workbench/artifacts
  # Until this line existed, no service here named a profile, so the whole
  # stack ran `config.default.toml` -- and the shipped defaults have no MCP
  # servers, no triage, no Code and no delegation. Nothing had chosen that;
  # it was what happens when nobody chooses. The profile is what chose.
  AW_CONFIG_FILE: /app/config/config.compose-local.toml
  # Where the weights are, for the one process that loads them: the encoder
  # (ADR-0106). It is a named volume rather than a layer in the image (see
  # `weights-init`) and it must be outside the read-only root. The variable
  # is in the shared block because it is harmless where the volume is not
  # mounted -- nothing in the other four ever opens the directory -- and one
  # block is easier to keep true than two.
  HF_HOME: /var/lib/agent-workbench/hf-cache

x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    # Keep the exact image used by the CI service test job.
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_USER: agent
      POSTGRES_DB: agent_workbench
      # This Compose file is a loopback-only local demo. It deliberately has
      # no database credential to bake into source or image layers; do not use
      # this trust configuration for a remotely reachable deployment.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_workbench"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  qdrant:
    # Same digest as CI: client/server compatibility is tested against it.
    image: qdrant/qdrant@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
    volumes:
      - qdrant_data:/qdrant/storage
    security_opt:
      - no-new-privileges:true

  # The other end of the OTLP exporter every process already had.
  #
  # `observability.otel_enabled` cannot be turned off, and the telemetry
  # adapter has been exporting since it landed -- into a hostname this topology
  # never defined. Telemetry fails open by design, so the stack looked healthy
  # while recording nothing, which is the same shape of claim-without-evidence
  # the flag itself used to be. It is not in the `demo` profile: the API exports
  # whether or not anybody opted into synthetic workers.
  # A fresh named volume is owned by root, and the collector image runs as
  # 10001 with no shell to fix it from. One `chown`, in the image this stack
  # already builds, so the collector can keep its own user.
  otel-init:
    image: agent-workbench:local
    build:
      context: .
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /var/lib/otel"]
    volumes:
      - otel_data:/var/lib/otel
    restart: "no"
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
    command: ["--config=/etc/otel/collector.yaml"]
    depends_on:
      otel-init:
        condition: service_completed_successfully
    volumes:
      - ./docker/otel-collector.yaml:/etc/otel/collector.yaml:ro
      - otel_data:/var/lib/otel
    # No published port. Nothing outside the stack needs to reach it, and the
    # loopback rule is easiest to keep when there is nothing to bind. Nothing
    # `depends_on` it either: a collector's problem must never become a run's
    # problem, which is the rule the telemetry factory already follows.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  qdrant-ready:
    build:
      context: .
    image: agent-workbench:local
    command: ["python", "/app/docker/wait_for_http.py"]
    environment:
      WAIT_FOR_HTTP_URL: http://qdrant:6333/readyz
      WAIT_FOR_HTTP_DEADLINE_SECONDS: "60"
    depends_on:
      qdrant:
        condition: service_started
    restart: "no"
    <<: *app-hardening

  # The weights, fetched once, before anything that would need them.
  #
  # Not an optimisation. The sparse arm checks the cache for BGE-M3's trained
  # lexical head *before* it builds the model and raises when it is missing,
  # because FlagEmbedding's own behaviour is to substitute a random projection
  # and carry on -- vectors of the right width that mean nothing. So a cold
  # cache does not make the first start slow, it makes the encoder exit -- and
  # since ADR-0106 that is the one process here that would (before it, all
  # four retrieving processes exited at once). `docker/fetch_weights.py`
  # carries the rest of the reasoning.
  #
  # Also not baked into the image: several gigabytes of weights in a layer make
  # every rebuild pull them again, and the build machine would have to reach
  # Hugging Face even when a warm volume is sitting right there.
  #
  # `HF_ENDPOINT` is huggingface_hub's own variable and is passed through
  # unset. Pointing every deployment's weights at a third-party mirror is a
  # supply-chain decision that belongs to whoever runs the stack, not to this
  # file; `docs/windows-quickstart.md` names the one that makes this finish on
  # a mainland-China connection, as a line somebody types on purpose.
  weights-init:
    image: agent-workbench:local
    build:
      context: .
    command: ["python", "/app/docker/fetch_weights.py"]
    environment:
      <<: *app-environment
      HF_ENDPOINT: "${HF_ENDPOINT-}"
    volumes:
      - hf_cache:/var/lib/agent-workbench/hf-cache
    restart: "no"
    <<: *app-hardening

  # The one process that holds the retrieval models (ADR-0106).
  #
  # Before it, the API, both Task Workers and the ingestion worker each loaded
  # BGE-M3 dense, BGE-M3 sparse and the reranker -- four copies of about
  # 6.7 GB of weights, on a machine that had to be handed 29 GB before the
  # Windows launcher would build. Now this container loads them once and the
  # other four ask it over HTTP; they carry no `hf_cache`, no `weights-init`
  # dependency, and import no torch. The memory floor the launcher checks is
  # this process's alone.
  #
  # `--host 0.0.0.0` on purpose, and the only service here that binds its
  # interface directly rather than through the loopback proxy: this is not an
  # MCP server and not a control plane -- it holds no identity, takes no
  # tool proposal, and answers only the other processes of this stack, which
  # is exactly what Qdrant does on the same network. No port is published.
  #
  # Health is 200 only once the models are loaded *and* warm, so the four
  # `depends_on` it below wait out the load and the first forward pass rather
  # than spending it on somebody's first request.
  encoder:
    image: agent-workbench:local
    build:
      context: .
    command: ["agent-encoder", "--host", "0.0.0.0", "--port", "8769"]
    environment: *app-environment
    depends_on:
      weights-init:
        condition: service_completed_successfully
    volumes:
      - hf_cache:/var/lib/agent-workbench/hf-cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8769/health', timeout=5)\"",
        ]
      interval: 10s
      timeout: 10s
      # Three models from a warm cache and a warm-up pass: minutes on a
      # laptop, not seconds. `up --wait` allows 600 s for the whole stack.
      retries: 60
      start_period: 120s
    <<: *app-hardening

  # The sandbox broker: the one container that holds the Docker socket
  # (ADR-0107).
  #
  # `sandbox_run` starts a `--network=none` container per call, which needs a
  # daemon to ask. ADR-0105 refused to put the socket where it would have had
  # to go then -- into the API's and the Workers' containers -- because a
  # socket there is root on the VM for anything that gets into a process that
  # also holds a provider key, a database and every workspace. This container
  # holds none of those: it runs `agent-sandbox-mcp` and nothing else, and the
  # others reach it only through a tunnel whose two ends are both loopback
  # (`docker/loopback_proxy.py`). A compromise of *this* process buys the
  # daemon, which is what the native path already hands the sandbox server.
  #
  # Root inside, because the socket is root-owned and mode 660; `cap_drop:
  # ALL` still applies, and uid 0 without capabilities opens the socket by
  # owning it and can do nothing else uid 0 usually can. The hardening anchor
  # is kept whole rather than relaxed.
  #
  # Health is "the HTTP server answers", not "the runtime answers": the
  # broker's own `/health` is 503 until `docker version` succeeds, and it
  # pulls its interpreter image on first start. Treating that 503 as unhealthy
  # would make `up --wait` fail the whole stack over a slow pull -- the shape
  # ADR-0105 §3.3 refused. The launchers of the API and the Workers wait for
  # the *runtime* instead (`docker/decide_sandbox.py`) and switch the sandbox
  # off for that start when it never comes, saying so in their logs.
  sandbox:
    image: agent-workbench:local
    build:
      context: .
    command: ["sh", "/app/docker/run-sandbox-local.sh"]
    user: "0:0"
    environment:
      # A name, not a value from the shared block: this process reads no
      # configuration file and touches no database.
      SANDBOX_PDF_IMAGE: agent-workbench-sandbox-pdf:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.error, urllib.request\ntry: urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=5)\nexcept urllib.error.HTTPError: pass\"",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
    <<: *app-hardening

  migrate:
    image: agent-workbench:local
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    <<: *app-hardening

  # The console may accept a provider key, but the API runs read-only and as a
  # non-root user. Prepare one narrow persistent volume for that write instead
  # of making the application filesystem writable or putting a secret in this
  # file. The API reads the key only at startup, so a saved key takes effect on
  # the next restart.
  provider-key-init:
    image: agent-workbench:local
    build:
      context: .
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "chown 10001:10001 /var/lib/agent-workbench/provider-key && chmod 0700 /var/lib/agent-workbench/provider-key",
      ]
    volumes:
      - provider_key_data:/var/lib/agent-workbench/provider-key
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    image: agent-workbench:local
    build:
      context: .
    command: ["sh", "/app/docker/run-api-local.sh"]
    environment:
      <<: *app-environment
      # The application stays on container loopback while the proxy owns the
      # published port. Giving them distinct ports avoids a hidden bind race.
      AW_API__PORT: "8001"
      LOCAL_PROXY_PORT: "8000"
      LOCAL_PROXY_UPSTREAM_PORT: "8001"
      # No credential is present on a fresh stack. The Settings page writes it
      # to the volume below; these public catalogue ids make the next API start
      # capable of assembling Direct Chat from that stored key. The console's
      # switches (ADR-103) land in the same directory, as `switches.json`.
      AW_KEY_FILE: /var/lib/agent-workbench/provider-key/key
      AW_MODEL__MAIN__MODEL_ID: deepseek-chat
      AW_MODEL__COMPACT__MODEL_ID: deepseek-chat
      # Chat's web search, and the only value this file can honestly carry for
      # it is the operator's own. `true` here would refuse to start on a fresh
      # stack (no key yet, and `research.enabled` without one is a startup
      # error); `false` here would silently override the launcher. So: whatever
      # the host says, and nothing when the host says nothing -- `run-api-local.sh`
      # decides that case by probing for a key, and its comment carries why.
      #
      # `-` rather than `:-`: an unset variable arrives as the empty string,
      # which the launcher reads as "nobody decided" and the settings loader
      # reads as False. `:-false` would look equivalent and would instead pin
      # the switch off on every machine that never sets it.
      AW_RESEARCH__ENABLED: "${AW_RESEARCH__ENABLED-}"
      # The sandbox, on the same terms as web search above: the operator's
      # own value or nothing, and `run-api-local.sh` decides nothing by
      # probing the broker's runtime (ADR-0107). `true` here would make a
      # stack whose broker could not pull its image refuse to start.
      AW_CODE__SANDBOX_ENABLED: "${AW_CODE__SANDBOX_ENABLED-}"
      AW_SANDBOX__ENABLED: "${AW_SANDBOX__ENABLED-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider-key-init:
        condition: service_completed_successfully
      qdrant-ready:
        condition: service_completed_successfully
      # Loaded and warm before this process assembles retrieval over it
      # (ADR-0106): the remote adapters refuse to build against an encoder
      # that does not answer, and an API that started first would come up
      # honestly reporting no retrieval.
      encoder:
        condition: service_healthy
      # Answering before this process decides whether `sandbox_run` is on.
      sandbox:
        condition: service_healthy
    # The computer-use server runs on the host, because no container can
    # reach the desktop (ADR-0108). This is Docker Desktop's name for the
    # host on Windows and macOS; the `host-gateway` mapping makes the same
    # name resolve on a Linux engine. The API reads that server's one
    # read-only route through a loopback tunnel to this name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # The only host-published port is loopback. The app itself remains
      # container-loopback-only; the local proxy exists solely for Docker NAT.
      - "127.0.0.1:8000:8000"
    volumes:
      - artifact_data:/var/lib/agent-workbench/artifacts
      - provider_key_data:/var/lib/agent-workbench/provider-key
      # The one folder a coding session may write on the host (ADR-0109).
      #
      # A Code turn runs in this process and reads and writes the project's
      # real files (ADR-074). Before this line the only files it could reach
      # were the image's own: the folder picker opened at `/app`, every
      # directory in it was choosable, and the first `project_write` failed
      # on the read-only root with a sentence that reads like a broken tool.
      # This is the host directory the picker opens in instead
      # (`code.projects_root` in the profile), and the only bind mount any
      # application service carries. It is deliberately not `$HOME`: a coding
      # session that may edit files has a folder, not the disk.
      #
      # Relative to this file, so a double-clicked `stack.cmd` gets
      # `<checkout>\var\projects` (created by the launcher; `var/` is
      # gitignored). A person who keeps projects elsewhere sets
      # `AGENT_WORKBENCH_PROJECTS_DIR` -- outside the `AW_` namespace on
      # purpose, because settings reject unknown `AW_*` variables and this one
      # is read by Compose, never by the application.
      - "${AGENT_WORKBENCH_PROJECTS_DIR:-./var/projects}:/projects"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # Probe the same proxy path Docker NAT uses. A dead proxy must not
          # leave a deceptively healthy container whose UI is unreachable.
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2)\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    <<: *app-hardening

  task-worker:
    image: agent-workbench:local
    profiles: ["demo"]
    # Not `agent-task-worker` directly: this Worker's MCP tools live in two
    # loopback servers that have to be up and answering *before* it freezes its
    # tool catalogue, and whether it may run real handlers depends on a key
    # that may not exist yet. Both decisions are in the script.
    command: ["sh", "/app/docker/run-task-worker-local.sh"]
    environment:
      <<: *app-environment
      # The same key file and, beside it, the same switches file the API reads
      # (ADR-101, ADR-103). A `--demo` Worker uses neither -- its handlers are
      # synthetic -- but a Worker is the process that *registers* the tools an
      # envelope allows, so the day this flag comes off, "external_search is
      # on" has to mean the same thing in both containers. Mounting it now
      # makes that a one-flag change rather than a topology change.
      AW_KEY_FILE: /var/lib/agent-workbench/provider-key/key
      AW_SANDBOX__ENABLED: "${AW_SANDBOX__ENABLED-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider-key-init:
        condition: service_completed_successfully
      qdrant-ready:
        condition: service_completed_successfully
      encoder:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    volumes:
      - artifact_data:/var/lib/agent-workbench/artifacts
      - provider_key_data:/var/lib/agent-workbench/provider-key
    <<: *app-hardening

  # A second Worker, and the only reason it exists is to be a second one.
  #
  # Claim, lease, epoch and fencing are the part of this system that only means
  # anything under contention: with one Worker every one of those invariants
  # holds trivially, and a topology that ships one is a topology that cannot
  # show the thing it spent the most effort on. The concurrency tests prove it
  # against a real database; this makes it something a reader can watch.
  #
  # No worker id is set. Each process mints its own at startup, so two
  # containers from one image are already two distinct claimants -- and an id
  # pinned here would be an id two replicas could share.
  task-worker-b:
    image: agent-workbench:local
    profiles: ["demo"]
    # Not `agent-task-worker` directly: this Worker's MCP tools live in two
    # loopback servers that have to be up and answering *before* it freezes its
    # tool catalogue, and whether it may run real handlers depends on a key
    # that may not exist yet. Both decisions are in the script.
    command: ["sh", "/app/docker/run-task-worker-local.sh"]
    environment:
      <<: *app-environment
      # Same as task-worker, and for the same reason.
      AW_KEY_FILE: /var/lib/agent-workbench/provider-key/key
      AW_SANDBOX__ENABLED: "${AW_SANDBOX__ENABLED-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider-key-init:
        condition: service_completed_successfully
      qdrant-ready:
        condition: service_completed_successfully
      encoder:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    volumes:
      - artifact_data:/var/lib/agent-workbench/artifacts
      - provider_key_data:/var/lib/agent-workbench/provider-key
    <<: *app-hardening

  ingestion-worker:
    image: agent-workbench:local
    profiles: ["demo"]
    # `--demo` swapped the embedder for a hash of the chunk text: vectors of the
    # right width where similar sentences are not near each other. Nothing said
    # so -- the upload finished, the document rendered as searchable, and every
    # query came back empty-handed or wrong. With the embedding extra in the
    # image there is a real embedder to build, so it builds one.
    command: ["agent-ingestion-worker"]
    environment:
      <<: *app-environment
      # This is an explicitly profiled disposable demo: it may create the
      # local collection/alias that production startup is forbidden to alter.
      AW_QDRANT__ALLOW_LOCAL_BOOTSTRAP: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant-ready:
        condition: service_completed_successfully
      encoder:
        condition: service_healthy
    volumes:
      - artifact_data:/var/lib/agent-workbench/artifacts
    <<: *app-hardening

volumes:
  artifact_data:
  hf_cache:
  otel_data:
  postgres_data:
  provider_key_data:
  qdrant_data:
